<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Escalender – Rätselkalender bauen</title>
  <meta name="description" content="Rätselkalender im Escape-Room-Stil – zu Weihnachten, zum Geburtstag, für Ferien oder Klasse. Im Browser, ohne Anmeldung.">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Cpath d='M4 26 L20 3 L28 26Z' fill='%23d62839'/%3E%3Crect x='2' y='24' width='28' height='6' rx='3' fill='%23fdfaf3'/%3E%3C/svg%3E">
  <style>:root {
  --bg: #f4f1ea; --flaeche: #ffffff; --linie: #e2ddd2; --text: #24252f; --leise: #6d6f7b;
  --rot: #c8283a; --rot-hell: #fbe9eb; --gold: #e0a92e; --gruen: #2d6a4f;
  --hinweis: #3a6ea5; --hinweis-hell: #eaf1f9; --schloss: #b0651b; --schloss-hell: #fbf1e6; --belohnung: #2d7a55; --belohnung-hell: #e8f5ee;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body { font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); font-size: 14px; display: flex; flex-direction: column; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; background: var(--flaeche); border: 1px solid var(--linie); border-radius: 8px; padding: 6px 12px; }
button:hover { border-color: #c9c2b2; }
button.haupt { background: var(--rot); border-color: var(--rot); color: #fff; font-weight: 700; }
button.klein { padding: 3px 9px; font-size: 12.5px; }
button.gefahr { color: var(--rot); }
button:disabled { opacity: .35; cursor: default; }
code { font-size: 11.5px; background: #f0ece3; padding: 1px 6px; border-radius: 4px; color: var(--leise); }
.warn { color: #a3470a; }

/* Kopfleiste */
.leiste { display: flex; align-items: center; gap: 16px; padding: 10px 16px; background: #1d2440; color: #fff; flex-wrap: wrap; }
.marke { font-weight: 800; font-size: 15px; display: inline-flex; align-items: center; gap: 6px; color: inherit; text-decoration: none; }
a.marke:hover { color: var(--gold, #f4c95d); }
.marke .ico { width: 18px; height: 18px; color: var(--gold, #f4c95d); }
.ico { width: 1.1em; height: 1.1em; vertical-align: -.2em; flex: none; }
.nav-punkt .ico { width: 16px; height: 16px; margin-right: 7px; opacity: .75; }
.nav-punkt.aktiv .ico { opacity: 1; }
.punkt-status { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; background: #999; }
.punkt-status.ok { background: #2d8a4e; } .punkt-status.offen { background: #e0a100; } .punkt-status.fehler { background: var(--rot); } .punkt-status.leer { background: #bbb; }
#projektname { color: #b8c0d9; min-width: 100px; max-width: 30%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.knoepfe { display: flex; gap: 6px; }
.knoepfe button { background: rgba(255,255,255,.1); border-color: rgba(255,255,255,.18); color: #fff; }
.knoepfe button.haupt { background: var(--rot); border-color: var(--rot); }
#status { flex: 1; font-size: 12px; color: #8d96b3; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#status.warn { color: #ffcf8a; }

/* Arbeitsfläche */
.arbeit { --nav-b: 220px; --vorschau-b: 420px; flex: 1; display: grid; grid-template-columns: var(--nav-b) minmax(0, 1fr) var(--vorschau-b); min-height: 0; position: relative; }
/* Ziehgriffe zum Verbreitern der Spalten (wie bei OneNote) */
.zieher { position: absolute; top: 0; bottom: 0; width: 9px; margin-left: -4px; cursor: col-resize; z-index: 5; touch-action: none; }
.zieher::after { content: ''; position: absolute; top: 0; bottom: 0; left: 4px; width: 1px; background: transparent; transition: background .15s; }
.zieher:hover::after, .zieher.aktiv::after { background: var(--rot); width: 3px; left: 3px; }
.zieher-nav { left: var(--nav-b); }
.zieher-vorschau { right: var(--vorschau-b); margin-left: 0; margin-right: -4px; }
body.zieht { cursor: col-resize; user-select: none; }
body.zieht iframe { pointer-events: none; }
#nav { border-right: 1px solid var(--linie); overflow-y: auto; overflow-x: hidden; padding: 10px 8px 30px; background: #faf8f3; }
.nav-gruppe { font-size: 11px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase; color: var(--leise); margin: 14px 8px 6px; }
.nav-punkt { display: block; width: 100%; text-align: left; border: 0; background: none; padding: 7px 10px; border-radius: 8px; margin-bottom: 1px; }
.nav-punkt:hover, .nav-tuer:hover { background: #efebe2; }
.nav-punkt.aktiv, .nav-tuer.aktiv { background: var(--rot-hell); color: var(--rot); font-weight: 700; }
.nav-tueren { display: flex; flex-direction: column; gap: 1px; }
.nav-tuer { display: grid; grid-template-columns: 24px 62px 1fr 10px; align-items: center; gap: 4px; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 8px; }
.nav-tuer .nr { font-weight: 800; }
.nav-tuer .datum { color: var(--leise); font-size: 12px; white-space: nowrap; }
.nav-tuer .icons { font-size: 12px; white-space: nowrap; overflow: hidden; }
.nav-tuer.leer .nr, .nav-tuer.leer .datum { opacity: .45; }
.punkt { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); }
#nav .warn.klein { font-size: 12px; padding: 6px 10px; }

#editor { overflow-y: auto; padding: 20px 28px 0; }
#editor h2 { margin: 0 0 6px; font-size: 22px; }
.willkommen { background: #fff; border: 1px solid var(--linie); border-left: 5px solid var(--rot); border-radius: 12px; padding: 16px 20px; margin-bottom: 22px; }
.willkommen h2 { margin-top: 0 !important; }
.willkommen ol { padding-left: 20px; line-height: 1.7; }
.willkommen li .klein { margin-left: 8px; }
.erklaerung-block .hilfe-text { margin: 0 0 16px; }
.erklaerung .hilfe-knopf { vertical-align: 0; }
.erklaerung { color: var(--leise); max-width: 900px; line-height: 1.5; margin: 4px 0 16px; }

/* Formulare */
.formular { display: flex; flex-direction: column; gap: 10px; }
.feld { display: flex; flex-direction: column; gap: 4px; }
.feld > label { font-size: 12.5px; font-weight: 600; color: var(--leise); }
.feld input[type=text], .feld input[type=number], .feld input[type=date], .feld select, .feld textarea {
  border: 1px solid var(--linie); border-radius: 8px; padding: 7px 10px; background: #fff; width: 100%; max-width: none;
}
.feld textarea { resize: vertical; line-height: 1.45; }
.feld input:focus, .feld select:focus, .feld textarea:focus { outline: 2px solid #f0c7cc; border-color: var(--rot); }
.feld-bool { flex-direction: row; align-items: center; gap: 8px; }
.feld-bool label { font-size: 13.5px; color: var(--text); font-weight: 500; }
.asset-feld { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.asset-feld select { max-width: 320px; }
.asset-feld .mini { height: 44px; border-radius: 6px; border: 1px solid var(--linie); }
.unterfelder { display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
.unterfeld { border-left: 3px solid var(--linie); padding: 4px 0 4px 12px; width: 100%; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }
.hinweis-leer { color: #a3470a; font-size: 13px; }

.karte-element { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: 14px 16px; margin-bottom: 12px; }
.kopfzeile { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.kopfzeile .klein { margin-left: auto; }
.nummern { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.nummern span { background: #f4f1ea; border-radius: 6px; padding: 2px 8px; font-size: 12.5px; }
.nummern b { color: var(--rot); }
.palette { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 4px; }

/* Türchen */
.tuer-kopf { display: flex; align-items: baseline; gap: 12px; margin-bottom: 12px; }
.tuer-kopf .datum { color: var(--leise); }
.tuer-kopf .klein-wahl { margin-left: auto; border: 1px solid var(--linie); border-radius: 8px; padding: 3px 8px; background: #fff; font-size: 12.5px; }
.leer-box { background: var(--flaeche); border: 2px dashed var(--linie); border-radius: 14px; padding: 30px; text-align: center; color: var(--leise); }
.stufe-box { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 14px; padding: 14px 16px 16px; margin: 16px 0; }
.stufe-titel { display: flex; justify-content: space-between; align-items: center; font-weight: 800; font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--leise); margin-bottom: 8px; }
.stufe-neu { display: flex; align-items: center; gap: 12px; color: var(--leise); font-size: 13px; }

.fach { border-radius: 12px; padding: 10px 12px 8px; margin-top: 10px; }
.fach-kopf { margin-bottom: 8px; }
.fach-kopf span { color: var(--leise); }
.fach.fach-hinweis { background: var(--hinweis-hell); } .fach-hinweis .fach-kopf strong { color: var(--hinweis); }
.fach.fach-schloss { background: var(--schloss-hell); } .fach-schloss .fach-kopf strong { color: var(--schloss); }
.fach.fach-belohnung { background: var(--belohnung-hell); } .fach-belohnung .fach-kopf strong { color: var(--belohnung); }
.fach-liste { display: flex; flex-direction: column; gap: 8px; min-height: 20px; }
.fach-leer { color: var(--leise); font-size: 12.5px; padding: 10px; border: 2px dashed rgba(0,0,0,.1); border-radius: 10px; text-align: center; }

.baustein { background: #fff; border-radius: 10px; padding: 10px 12px 12px; border: 1px solid rgba(0,0,0,.06); box-shadow: 0 1px 2px rgba(0,0,0,.04); }
.baustein.zieht { opacity: .4; }
.baustein-kopf { cursor: grab; display: flex; align-items: center; gap: 8px; font-weight: 700; margin-bottom: 8px; }
.baustein-kopf select { font-weight: 600; border: 1px solid var(--linie); border-radius: 8px; padding: 4px 8px; background: #fff; }
.baustein-kopf .aktionen { margin-left: auto; display: flex; gap: 2px; }
.griff { cursor: grab; color: #b3ad9f; letter-spacing: -2px; user-select: none; padding: 0 2px; }
.mini-knopf { border: 0; background: none; padding: 2px 6px; color: var(--leise); }
.mini-knopf:hover { background: #f0ece3; }
.einfuege { height: 4px; border-radius: 2px; background: var(--rot); margin: -2px 0; }
.chip { border-radius: 999px; font-size: 12.5px; padding: 4px 11px; background: rgba(255,255,255,.75); }
.chip:active { cursor: grabbing; }

/* Medien */
.medien { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
.medium { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: 8px; display: flex; flex-direction: column; gap: 4px; }
.medium img, .medium .platzhalter { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 8px; background: #f0ece3; display: flex; align-items: center; justify-content: center; font-size: 28px; color: var(--leise); }
.medium .platzhalter .ico { width: 32px; height: 32px; }
.medium img { object-fit: contain; }
.medium.fehlt { border-color: #f0c080; background: #fffaf2; }
.medium .name { font-weight: 600; font-size: 12.5px; word-break: break-all; }
.medium .info { font-size: 11.5px; color: var(--leise); }
.medium .aktionen { display: flex; gap: 4px; }
.warnliste li { margin-bottom: 6px; }
.warnliste a { color: var(--text); }

/* Vorschau */
.vorschau { border-left: 1px solid var(--linie); display: flex; flex-direction: column; min-height: 0; background: #e9e5dc; }
.vorschau-kopf { display: flex; align-items: center; gap: 12px; padding: 10px 14px; border-bottom: 1px solid var(--linie); background: #faf8f3; }
.vorschau-kopf label { color: var(--leise); font-size: 12.5px; display: flex; align-items: center; gap: 4px; }
.vorschau-kopf button { margin-left: auto; }
.telefon { flex: 1; padding: 14px; min-height: 0; overflow: hidden; position: relative; }
/* absolut platziert: die Handygrösse wirkt nicht auf die Grösse der Spalte zurück */
.geraet-rahmen { position: absolute; top: 22px; left: 50%; transform: translateX(-50%); }
.geraet { position: absolute; left: 0; top: 0; width: 390px; height: 844px; transform-origin: 0 0; border-radius: 44px; background: #1d2440; box-shadow: 0 0 0 10px #1d2440, 0 16px 44px rgba(0,0,0,.28); }
.geraet iframe { width: 100%; height: 100%; border: 0; border-radius: 40px; background: #14213d; display: block; }
.vorschau-fuss { font-size: 12px; color: var(--leise); padding: 0 16px 10px; text-align: center; }
.vorschau-fuss label { display: inline-flex; align-items: center; gap: 4px; }
.heute-wahl { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: var(--leise); }
.heute-wahl select { border: 1px solid var(--linie); border-radius: 8px; padding: 3px 6px; background: #fff; font-weight: 700; color: var(--text); }

/* Dialog */
.dialog { position: fixed; inset: 0; background: rgba(20,24,40,.5); display: flex; align-items: center; justify-content: center; z-index: 100; padding: 16px; }
.dialog-box { background: #fff; border-radius: 16px; padding: 22px 24px; max-width: 560px; width: 100%; max-height: 90vh; overflow: auto; }
.dialog-box h2 { margin: 0 0 10px; }
.dialog-knoepfe { display: flex; flex-direction: column; gap: 8px; margin: 14px 0; }
.dialog-knoepfe button { text-align: left; padding: 10px 14px; }
.warnkasten { background: #fff5e6; border-radius: 8px; padding: 8px 12px; }
.warnkasten ul { margin: 8px 0 0; padding-left: 18px; font-size: 13px; }
.schliessen { margin-top: 6px; }

@media (max-width: 1100px) {
  .zieher { display: none; }
  .arbeit { grid-template-columns: 200px minmax(0, 1fr); }
  .vorschau { grid-column: 1 / -1; min-height: 720px; border-left: 0; border-top: 1px solid var(--linie); }
  body { height: auto; }
}
@media (max-width: 700px) {
  .arbeit { grid-template-columns: 1fr; }
  #nav { max-height: 240px; border-right: 0; border-bottom: 1px solid var(--linie); }
  #editor { padding: 16px; }
}

/* Story-Assistent */
#editor h3 { font-size: 15px; margin: 26px 0 10px; }
textarea.prompt { width: 100%; max-width: none; border: 1px solid var(--linie); border-radius: 10px; padding: 10px 12px; font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 12px; line-height: 1.45; background: #fff; }
textarea.prompt[readonly] { background: #faf8f3; }
.reihe-knoepfe { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin: 8px 0; }
.reihe-knoepfe select { border: 1px solid var(--linie); border-radius: 8px; padding: 6px 8px; background: #fff; max-width: 100%; min-width: 0; flex: 1 1 260px; }
.leise { color: var(--leise); font-size: 12.5px; }
.ergebnis .ok { color: var(--gruen); font-weight: 600; }
.haken { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.haken span { display: inline-flex; align-items: center; gap: 5px; }
.haken label { font-size: 13px; }

.mono { font-family: ui-monospace, Menlo, Consolas, "Courier New", monospace; }
textarea.mono { font-size: 13px; }
.schablone-pruefung { background: #faf8f3; border: 1px solid var(--linie); border-radius: 8px; padding: 8px 12px; display: flex; flex-direction: column; gap: 4px; max-width: 680px; }
.schablone-pruefung b { letter-spacing: .12em; }
.kopfzeile .klein:first-of-type { margin-left: auto; }
.kopfzeile .klein + .klein { margin-left: 0; }

/* Führung */
.experte { color: #b8c0d9; font-size: 12.5px; display: flex; align-items: center; gap: 4px; white-space: nowrap; }
.checkliste { margin-bottom: 6px; }
.checkliste .schritt { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 5px 8px; border-radius: 8px; font-size: 13px; color: var(--leise); }
.checkliste .schritt:hover { background: #efebe2; }
.checkliste .haken { width: 20px; height: 20px; border-radius: 50%; border: 2px solid #cfc8b8; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 800; flex: none; }
.checkliste .schritt.ok { color: var(--gruen); }
.checkliste .schritt.ok .haken { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.checkliste .schritt.fehler { color: var(--rot); font-weight: 700; }
.checkliste .schritt.fehler .haken { background: var(--rot); border-color: var(--rot); color: #fff; }
.checkliste .schritt.naechster:not(.ok) { color: var(--text); font-weight: 700; background: #fff; box-shadow: inset 0 0 0 1px var(--linie); }
.punkt.rot { background: var(--rot); }
.fehler-titel { color: var(--rot); }
.warnliste.fehler li a { color: var(--rot); font-weight: 600; }
.ok { color: var(--gruen); font-weight: 600; }
.hilfe-knopf { border: 1px solid #cfc8b8; background: #fff; color: var(--leise); width: 18px; height: 18px; border-radius: 50%; padding: 0; font-size: 11px; font-weight: 800; line-height: 1; margin-left: 6px; vertical-align: 1px; }
.hilfe-knopf:hover { border-color: var(--rot); color: var(--rot); }
.hilfe-text { background: #fffbea; border: 1px solid #f0e2a8; border-radius: 8px; padding: 8px 12px; margin: 2px 0 4px; font-size: 13px; line-height: 1.5; max-width: 900px; color: var(--text); }
.fach-kopf .hilfe-text { margin-top: 6px; }
.start-box { max-width: 720px; }
.start-box h1 { margin: 0 0 4px; font-size: 26px; }
.start-karten { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; margin-top: 14px; grid-auto-rows: 1fr; }
.start-karte { display: flex; flex-direction: column; gap: 6px; height: 100%; align-items: flex-start; text-align: left; padding: 16px; border-radius: 14px; border: 1px solid var(--linie); background: #faf8f3; }
.start-karte:hover { border-color: var(--rot); background: #fff; }
.start-karte .icon { width: 40px; height: 40px; border-radius: 12px; background: var(--rot-hell); color: var(--rot); display: grid; place-items: center; }
.start-karte .icon .ico { width: 22px; height: 22px; }
.haupt-karte .icon { background: var(--rot); color: #fff; }
.start-karte strong { font-size: 15.5px; }
.start-karte span:last-child { color: var(--leise); font-size: 13px; line-height: 1.45; }
.start-karte.haupt-karte { border-color: var(--rot); background: var(--rot-hell); }
@media (max-width: 600px) { .start-karten { grid-template-columns: 1fr; } .experte { display: none; } }
.leer-zeile { color: var(--leise); }
.leer-zeile a { color: var(--text); }

/* Phasen-Checkliste */
.checkliste .phase { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 0; background: none; padding: 6px 8px; border-radius: 8px; font-size: 13.5px; font-weight: 700; color: var(--leise); }
.checkliste .phase:hover { background: #efebe2; }
.checkliste .phase.aktuell { color: var(--text); }
.checkliste .phase.ok { color: var(--gruen); }
.checkliste .phase.ok .haken { background: var(--gruen); border-color: var(--gruen); color: #fff; }
.checkliste .phase.aktuell .haken { border-color: var(--rot); color: var(--rot); }
.checkliste .phase .punkt { margin-left: auto; }
.checkliste .phase-schritte { margin: 0 0 6px 18px; border-left: 2px solid var(--linie); padding-left: 6px; }
.checkliste .phase-schritte .schritt { font-size: 12.5px; padding: 4px 8px; }
.checkliste .phase-schritte .haken { width: 16px; height: 16px; font-size: 10px; }
.speicher-erinnerung { background: #fffbea; border: 1px solid #f0e2a8; border-radius: 10px; padding: 8px 10px; font-size: 12.5px; margin: 0 4px 8px; display: flex; flex-direction: column; gap: 6px; align-items: flex-start; }

/* Story-Assistent Schritt für Schritt */
.schritt-leiste { display: flex; flex-wrap: wrap; gap: 6px; margin: 6px 0 14px; }
.schritt-leiste .pille { border-radius: 999px; padding: 4px 10px; font-size: 12.5px; color: var(--leise); }
.schritt-leiste .pille b { display: inline-block; min-width: 1.2em; }
.schritt-leiste .pille.erledigt { color: var(--gruen); border-color: #b9dcc9; background: #f2faf5; }
.schritt-leiste .pille.aktiv { color: #fff; background: var(--rot); border-color: var(--rot); font-weight: 700; }
.schritt-karte { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 14px; padding: 16px 20px 18px; }
.schritt-karte h3 { margin: 0 0 12px; font-size: 17px; }
.schritt-fuss { display: flex; align-items: center; justify-content: space-between; gap: 12px; margin-top: 18px; padding-top: 12px; border-top: 1px solid var(--linie); }
.schritt-fuss .weiter { margin-left: auto; }
.klein-text { font-size: 12.5px; }
.sperre { background: var(--rot-hell); border-radius: 10px; padding: 12px 14px; display: flex; flex-direction: column; gap: 8px; align-items: flex-start; }
details.erweitert { margin-top: 10px; }
details.erweitert summary, .schritt-karte details summary { cursor: pointer; color: var(--leise); font-size: 13px; margin: 8px 0; }
ol.anleitung { line-height: 1.7; padding-left: 20px; margin: 10px 0; }

/* Nur du ergänzen / Drucken */
.ergaenzen-gruppe { background: var(--flaeche); border: 1px solid var(--linie); border-radius: 12px; padding: 12px 16px; margin-bottom: 12px; }
.ergaenzen-gruppe h3 { margin: 0; display: flex; align-items: center; gap: 8px; }
.ergaenzen-gruppe .zahl { background: var(--gold); color: #fff; border-radius: 999px; font-size: 12px; padding: 1px 8px; }
.ergaenzen-liste { padding-left: 18px; line-height: 1.5; }
.ergaenzen-liste > li { margin-bottom: 6px; }
.ergaenzen-liste > li > a { font-weight: 700; color: var(--text); }
.ergaenzen-liste ul { color: var(--leise); font-size: 13px; padding-left: 18px; }
.gruppe-ok { color: var(--gruen); margin: 6px 0 12px; font-weight: 600; }
.druck-schritte { line-height: 1.6; }
.druck-schritte > li { margin-bottom: 12px; }
.druck-schritte > li.ok::marker { color: var(--gruen); }
.versteck-liste { font-size: 13px; }
.schritt-leiste .pille:disabled { opacity: .45; cursor: not-allowed; background: transparent; }
.heute-wahl, .vorschau-kopf button { white-space: nowrap; }
.vorschau-kopf { flex-wrap: nowrap; gap: 10px; }
@media (max-width: 700px) { .vorschau-kopf { flex-wrap: wrap; } }

.farb-feld { display: flex; align-items: center; gap: 10px; }
.farb-feld input[type=color] { width: 48px; height: 34px; padding: 2px; border: 1px solid var(--linie); border-radius: 8px; background: #fff; cursor: pointer; }
.farb-block { display: grid; gap: 8px; }
.farb-hex { flex: 0 0 96px; width: 96px; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
.farb-muster-reihe { display: flex; flex-wrap: wrap; gap: 6px; }
.farb-muster { width: 28px; height: 28px; border-radius: 8px; border: 2px solid #fff; box-shadow: 0 0 0 1px var(--linie); padding: 0; cursor: pointer; }
.farb-muster.aktiv { box-shadow: 0 0 0 2px var(--rot); transform: scale(1.1); }
button.link { background: none; border: 0; padding: 0; color: var(--rot); text-decoration: underline; font: inherit; cursor: pointer; }
h4.unter-titel { margin: 18px 0 4px; font-size: 14px; color: var(--leise); text-transform: uppercase; letter-spacing: .06em; }
.checkliste .schritt.gesperrt { opacity: .45; cursor: not-allowed; }
.checkliste .schritt.gesperrt:hover { background: none; }

.nav-klapp { display: block; width: calc(100% - 16px); text-align: left; border: 0; background: none; cursor: pointer; }
.nav-klapp:hover { color: var(--text); }
.schritt-zaehler { font-size: 13px; font-weight: 500; color: var(--leise); margin-left: 12px; }

.nav-gruppe-zeile { display: flex; align-items: center; justify-content: space-between; gap: 6px; }
.nav-status { border: 0; background: none; padding: 2px 6px; border-radius: 6px; font-size: 11.5px; font-weight: 700; text-transform: none; letter-spacing: 0; color: var(--leise); white-space: nowrap; }
.nav-status:hover, .nav-status.aktiv { background: var(--rot-hell); color: var(--rot); }
.frage-knoepfe { display: flex; justify-content: flex-end; gap: 8px; margin-top: 16px; }

/* Hervorhebung nach dem Sprung aus einer Meldung */
.hervor { outline: 3px solid var(--rot); outline-offset: 4px; border-radius: 10px; animation: hervor-puls 1s ease-in-out 3; }
.feld.hervor { padding: 4px 6px; margin: -4px -6px; }
@keyframes hervor-puls { 50% { outline-color: var(--gold); } }

.warnliste li { margin-bottom: 8px; }
.was-tun { color: var(--leise); font-size: 12.5px; margin: 2px 0 0 14px; }
.warnliste.fehler .was-tun { color: var(--text); }

.emoji-zeile { display: flex; align-items: center; gap: 10px; }
.emoji-feld { max-width: 120px !important; font-size: 22px; text-align: center; }
.emoji-gross { font-size: 40px; line-height: 1; }
.emoji-gruppen { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
.emoji-gruppe { display: flex; align-items: center; flex-wrap: wrap; gap: 3px; }
.emoji-titel { font-size: 11.5px; color: var(--leise); width: 58px; flex: none; }
.emoji-wahl { border: 1px solid transparent; background: none; font-size: 22px; padding: 2px 4px; border-radius: 8px; line-height: 1.2; }
.emoji-wahl:hover { background: #efebe2; border-color: var(--linie); }
.emoji-wahl.aktiv { background: var(--rot-hell); border-color: var(--rot); }

.download-ok:empty { display: none; }
.download-ok { background: #e8f5ee; border: 1px solid #b9dcc9; color: var(--gruen); border-radius: 10px; padding: 10px 12px; font-size: 13.5px; line-height: 1.5; }
button.erledigt { background: var(--gruen) !important; border-color: var(--gruen) !important; color: #fff !important; }

/* Fenster offen: Hintergrund scrollt nicht mit */
body.fenster-offen { overflow: hidden; }
body.fenster-offen .arbeit { pointer-events: none; }
body.fenster-offen .dialog { pointer-events: auto; }
.frage-dialog .dialog-box { max-width: 460px; }
.frage-dialog p { line-height: 1.5; margin: 6px 0; }
button.gefahr-knopf { background: var(--rot) !important; border-color: var(--rot) !important; }

/* Der Schritt, an dem man gerade arbeitet */
.checkliste .schritt.aktiv { background: var(--rot-hell); color: var(--rot); font-weight: 700; box-shadow: none; }
.checkliste .schritt.aktiv .haken { border-color: var(--rot); color: var(--rot); }
.checkliste .schritt.ok.aktiv .haken { background: var(--gruen); border-color: var(--gruen); color: #fff; }
h2 .wechsel { margin-left: 14px; font-weight: 500; vertical-align: middle; }

/* Zurück/Weiter kleben am unteren Rand des Editors – auf jedem Bildschirm sichtbar, ganz rechts */
.weg-fuss { position: sticky; bottom: 0; z-index: 3; margin: 24px -28px 0; padding: 12px 28px 14px; background: var(--bg); border-top: 1px solid var(--linie); box-shadow: 0 -8px 16px -12px rgba(0,0,0,.25); }
#editor > :last-child:not(.weg-fuss) { margin-bottom: 80px; }
.schritt-karte .schritt-fuss { position: sticky; bottom: 0; z-index: 3; background: var(--flaeche); margin: 18px -20px -18px; padding: 12px 20px 14px; border-radius: 0 0 14px 14px; box-shadow: 0 -8px 16px -12px rgba(0,0,0,.25); }
.nav-spaeter { opacity: .55; }
.nav-spaeter .nav-status { font-weight: 500; }
.knoepfe button:disabled { opacity: .45; cursor: not-allowed; }
.checkliste .phase.gesperrt { opacity: .45; cursor: not-allowed; }
.checkliste .phase.gesperrt:hover { background: none; }
.willkommen { position: relative; }
.willkommen-zu { position: absolute; top: 8px; right: 10px; border: 0; background: none; font-size: 22px; line-height: 1; color: var(--leise); padding: 4px 8px; border-radius: 8px; }
.willkommen-zu:hover { background: #efebe2; color: var(--text); }
.weg-kopf { font-size: 22px; font-weight: 800; margin: 0 0 14px; }

/* AR-Ziel aus Foto: Fortschritt */
.asset-knoepfe { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.mind-zeile { display: flex; gap: 14px; align-items: center; margin-top: 14px; }
.mind-vorschau { width: 96px; height: 72px; object-fit: cover; border-radius: 8px; background: #eee; flex: none; }
.mind-stand { flex: 1; min-width: 0; }
.balken { height: 10px; border-radius: 999px; background: #eee6d6; overflow: hidden; margin-bottom: 8px; }
.balken-fuellung { height: 100%; width: 0; background: var(--rot); border-radius: inherit; transition: width .3s; }
.mind-stand p { margin: 2px 0 0; }

.freiwillig { background: #eef6ee; border: 1px solid #cfe3cf; color: #2d6a4f; border-radius: 10px; padding: 8px 12px; margin: 0 0 14px; font-size: 14px; }

/* Übersicht Sammlungen und Hilfsmittel */
.abschnitt { margin: 0 0 28px; }
.abschnitt h3 { font-size: 17px; margin: 0 0 4px; display: flex; align-items: center; gap: 6px; }
.abschnitt h3 .ico { color: var(--rot); }
.uebersicht { padding: 10px 14px; }
.uebersicht-zeile { display: flex; align-items: center; gap: 12px; }
.uebersicht-icon { width: 34px; height: 34px; border-radius: 9px; background: var(--rot-hell); color: var(--rot); display: grid; place-items: center; flex: none; }
.uebersicht-icon .ico { width: 18px; height: 18px; }
.uebersicht-text { flex: 1; min-width: 0; }
.uebersicht-text .klein-text { font-size: 12.5px; margin-top: 2px; }
.uebersicht-knoepfe { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
.uebersicht-inhalt { margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--linie); }

/* Katalog-Wähler */
.katalog-box { max-width: 720px; }
.katalog-liste { display: grid; gap: 8px; max-height: 60vh; overflow: auto; padding: 2px; }
.katalog-karte { display: grid; grid-template-columns: 40px 1fr auto; grid-template-areas: 'icon text mehr' 'lang lang lang'; gap: 4px 12px; align-items: start; text-align: left; padding: 10px 12px; border-radius: 12px; border: 1px solid var(--linie); background: var(--flaeche); cursor: pointer; }
.katalog-karte:hover { border-color: var(--rot); background: #fff; }
.katalog-karte.aktiv { border-color: var(--rot); box-shadow: 0 0 0 2px var(--rot-hell); }
.katalog-icon { grid-area: icon; font-size: 26px; line-height: 1; text-align: center; padding-top: 2px; }
.katalog-text { grid-area: text; display: grid; gap: 2px; min-width: 0; }
.katalog-kurz { color: var(--leise); font-size: 13px; }
.katalog-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.tag { font-size: 11px; border-radius: 999px; padding: 1px 8px; background: #eee9dd; color: var(--leise); }
.tag.paket-gratis { background: #e6f3e8; color: #2d6a4f; }
.tag.paket-papier, .tag.paket-kamera, .tag.paket-spiele { background: var(--rot-hell); color: var(--rot); }
.katalog-mehr { grid-area: mehr; align-self: start; }
.katalog-lang { grid-area: lang; font-size: 13px; line-height: 1.5; color: var(--text); background: #fffbea; border: 1px solid #f0e2a8; border-radius: 8px; padding: 8px 10px; margin-top: 4px; }
.chip-katalog { border-style: dashed; }
.schloss-kurz { margin-left: 8px; }

/* Quadratisch zuschneiden */
.schnitt-box { max-width: 600px; }
.schnitt-buehne { position: relative; margin: 0 auto; background: #222; border-radius: 8px; overflow: hidden; touch-action: none; }
.schnitt-buehne canvas { display: block; }
.schnitt-rahmen { position: absolute; box-shadow: 0 0 0 2px #fff, 0 0 0 9999px rgba(0,0,0,.35); cursor: move; touch-action: none; }
.schnitt-rahmen::before { content: ''; position: absolute; inset: 0; background: linear-gradient(to right, transparent 33.3%, rgba(255,255,255,.35) 33.3%, rgba(255,255,255,.35) calc(33.3% + 1px), transparent calc(33.3% + 1px), transparent 66.6%, rgba(255,255,255,.35) 66.6%, rgba(255,255,255,.35) calc(66.6% + 1px), transparent calc(66.6% + 1px)), linear-gradient(to bottom, transparent 33.3%, rgba(255,255,255,.35) 33.3%, rgba(255,255,255,.35) calc(33.3% + 1px), transparent calc(33.3% + 1px), transparent 66.6%, rgba(255,255,255,.35) 66.6%, rgba(255,255,255,.35) calc(66.6% + 1px), transparent calc(66.6% + 1px)); pointer-events: none; }
.schnitt-regler { display: flex; align-items: center; gap: 10px; margin: 12px 0 4px; }
.schnitt-regler input { flex: 1; }
.warnkasten.tarnung { background: #fffbea; border: 1px solid #f0e2a8; border-radius: 10px; padding: 10px 14px; margin: 10px 0; font-size: 14px; line-height: 1.5; }
.warnkasten.tarnung code { user-select: all; }

    radial-gradient(circle at 70% 30%, var(--punkt2) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 40% 70%, var(--punkt2) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 85% 80%, var(--punkt1) 0 2px, transparent 3px);
  background-size: 180px 180px, 240px 240px, 200px 200px, 260px 260px;
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
#app { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
/* Nach dem Aufklappen blendet die T\xFCrchen-Ansicht sanft ein */
#app.blende { animation: einblenden .45s ease-out both; }
@keyframes einblenden { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #app.blende { animation: none; } }

h1, h2 { font-family: var(--titel-schrift); font-weight: 800; letter-spacing: -.01em; }
/* Fraunces: weiche, leicht \xABschiefe\xBB Buchstaben \u2013 gibt dem Titel Charakter, den eine Standard-Serif nicht hat */
h1, .tuer .zahl, .gedicht p, .stueck .wort { font-variation-settings: 'SOFT' 60, 'WONK' 1; }
h1 { font-size: 28px; margin: 4px 0 0; line-height: 1.1; }
h2 { font-size: 22px; margin: 0 0 8px; }

button { font: inherit; cursor: pointer; }
.btn {
  background: var(--rot); color: var(--knopf-text, var(--creme)); border: 0; border-radius: 999px;
  padding: 12px 20px; font-weight: 800; font-size: 16px;
  box-shadow: 0 3px 0 var(--rot-dunkel);
  transition: transform .08s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--rot-dunkel); }
.btn.leise { background: transparent; color: var(--muted); box-shadow: none; padding: 8px 4px; font-weight: 600; }
.btn:disabled { opacity: .5; }

/* Kopf */
.kopf { display: flex; align-items: center; gap: 12px; margin: 8px 0 20px; }
.kopf img { width: 64px; height: 80px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
.kopf .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }

/* Kalender */
/* Flex statt Grid: eine unvollst\xE4ndige letzte Reihe wird zentriert */
.raster { --sp: 4; --abstand: 10px; display: flex; flex-wrap: wrap; justify-content: center; align-content: stretch; gap: var(--abstand); }
.raster .tuer { flex: 0 0 calc((100% - (var(--sp) - 1) * var(--abstand)) / var(--sp)); }
/* Icons */
.ico { width: 1.15em; height: 1.15em; vertical-align: -.22em; flex: none; }
.btn .ico { margin-right: 2px; }

/* T\xFCrchen: ein \xABBlatt\xBB mit Zahl, das beim Antippen aufklappt \u2013 dahinter leuchtet das Innere */
.tuer {
  aspect-ratio: 1; border-radius: 14px; border: 0; padding: 0; background: transparent;
  color: var(--tuer-text); font-family: var(--titel-schrift); font-weight: 800; font-size: 26px;
  position: relative; perspective: 700px; -webkit-tap-highlight-color: transparent;
}
.tuer .innen, .tuer .blatt { position: absolute; inset: 0; border-radius: inherit; display: flex; align-items: center; justify-content: center; }
.tuer .innen { background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--gold) 55%, var(--tief)) 0, var(--tief) 75%); color: var(--gold); box-shadow: inset 0 0 0 2px var(--linie2); }
.tuer .innen .ico { width: 42%; height: 42%; opacity: .9; }
.tuer .blatt {
  background: linear-gradient(160deg, var(--nacht2) 0%, color-mix(in srgb, var(--nacht2) 70%, var(--tief)) 100%);
  box-shadow: inset 0 0 0 2px var(--linie), inset 0 1px 0 rgba(255,255,255,.08);
  transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: transform .55s cubic-bezier(.4,0,.2,1), filter .2s;
}
/* T\xFCrrahmen: feine Linie innen, Scharnier-Andeutung links */
.tuer .blatt::before { content: ''; position: absolute; inset: 7px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,.14); pointer-events: none; }
.tuer .blatt::after { content: ''; position: absolute; left: 4px; top: 22%; bottom: 22%; width: 2px; border-radius: 2px; background: rgba(0,0,0,.18); }
.tuer.offen .blatt { background: linear-gradient(160deg, color-mix(in srgb, var(--rot) 88%, #fff) 0%, var(--rot) 45%, var(--rot-dunkel) 100%); box-shadow: 0 3px 0 var(--rot-dunkel), inset 0 1px 0 rgba(255,255,255,.22); }
.tuer.offen .blatt::before { border-color: rgba(255,255,255,.28); }
.tuer.geloest .blatt { background: linear-gradient(160deg, color-mix(in srgb, var(--tanne) 85%, #fff) 0%, var(--tanne) 45%, var(--tanne-dunkel) 100%); box-shadow: 0 3px 0 var(--tanne-dunkel), inset 0 1px 0 rgba(255,255,255,.18); }
.tuer.geloest .zahl { opacity: .55; }
.tuer.offen:hover .blatt { filter: brightness(1.07); }
.tuer.offen:active .blatt { transform: translateY(2px); box-shadow: 0 1px 0 var(--rot-dunkel); }
.tuer.auf .blatt { transform: rotateY(-108deg); box-shadow: -12px 0 24px rgba(0,0,0,.35); }
.tuer.auf .innen .ico { animation: aufleuchten .5s ease-out both; }
@keyframes aufleuchten { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: .9; } }
.tuer.heute .blatt { animation: puls 1.8s ease-in-out infinite; }
.tuer.zu { cursor: default; }
.tuer.zu .blatt { color: var(--zu-text); }
.tuer .zahl { position: relative; text-shadow: 0 1px 0 rgba(0,0,0,.18); }
/* Stempel \xABgel\xF6st\xBB: leicht schr\xE4g, wie aufgedr\xFCckt */
.tuer .stempel { position: absolute; width: 38%; max-width: 54px; right: 6%; top: 6%; color: var(--gold); transform: rotate(-14deg); opacity: .95; filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
.raster .tuer.letzte-breit { flex-basis: 100%; }
.raster .tuer.letzte-doppelt { flex-basis: calc((100% - (var(--sp) - 1) * var(--abstand)) / var(--sp) * 2 + var(--abstand)); }
.raster.sp-1 .tuer.letzte-doppelt { flex-basis: 100%; }
.raster .tuer.letzte { font-size: 34px; } .raster.sp-3 .tuer.letzte { font-size: 44px; } .raster.sp-2 .tuer.letzte, .raster.sp-1 .tuer.letzte { font-size: 60px; }
.tuer.letzte-besonders .blatt, .tuer.letzte-doppelt .blatt { box-shadow: inset 0 0 0 3px var(--gold), 0 0 18px color-mix(in srgb, var(--gold) 35%, transparent); }
.tuer.letzte.zu .blatt { color: color-mix(in srgb, var(--gold) 70%, transparent); }
.tuer .schleife { position: absolute; top: 7px; left: 9px; color: var(--gold); width: 20px; height: 20px; }
.tuer .schleife .ico { width: 100%; height: 100%; }
.tuer.letzte .stempel { max-width: 64px; width: 30%; }
@keyframes puls { 0%,100% { box-shadow: 0 3px 0 var(--rot-dunkel), 0 0 0 0 color-mix(in srgb, var(--gold) 60%, transparent); } 50% { box-shadow: 0 3px 0 var(--rot-dunkel), 0 0 0 8px transparent; } }
@media (prefers-reduced-motion: reduce) { .tuer.heute .blatt { animation: none; box-shadow: 0 0 0 3px var(--gold); } .tuer .blatt { transition: none; } }

.fuss { display: flex; justify-content: center; margin-top: 22px; }

/* Tag */
.kopfzeile { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; margin: 0 0 14px -4px; }
.kopfzeile .tagnr { text-align: center; }
.zurueck {
  width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--nacht2); color: var(--gold); font-size: 30px; line-height: 1; font-weight: 400;
  box-shadow: inset 0 0 0 1.5px var(--linie2); transition: filter .12s, transform .08s;
}
.zurueck .ico { width: 24px; height: 24px; margin-left: -2px; }   /* optisch zentriert: der Pfeil ist linkslastig */
.zurueck:hover { filter: brightness(1.15); }
.zurueck:active { transform: scale(.94); }
.tagnr { font-family: var(--titel-schrift); font-weight: 800; color: var(--gold); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.figur-sagt { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0 18px; }
.figur-sagt img { width: 54px; flex: none; margin-top: 4px; }
.blase {
  background: var(--karte); color: var(--karte-text); border-radius: var(--radius);
  padding: 14px 16px; font-size: 17px; line-height: 1.45; white-space: pre-line;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
  position: relative;
}
/* Sprechblasen-Spitze, zeigt zur Figur */
.figur-sagt .blase { border-top-left-radius: 6px; }
.figur-sagt .blase::before {
  content: ''; position: absolute; left: -10px; top: 18px;
  border: 8px solid transparent; border-right: 10px solid var(--karte); border-left: 0;
}
.karte { background: var(--nacht2); border-radius: var(--radius); padding: 16px; margin: 14px 0; }
.karte.hell { background: var(--karte); color: var(--karte-text); }
.frage { font-weight: 800; margin-bottom: 10px; }
.eingabe { display: flex; gap: 8px; }
.eingabe input {
  flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px;
  border-radius: 12px; border: 2px solid transparent; background: var(--creme); color: var(--karte-text);
}
.eingabe input:focus { outline: none; border-color: var(--gold); }
.antwort-hinweis { min-height: 22px; margin-top: 8px; color: var(--gold); font-weight: 600; font-size: 15px; }
.wackeln { animation: wackeln .35s; }
@keyframes wackeln { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }

.bilder { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin: 12px 0; }
.bilder img { width: 100%; border-radius: 12px; display: block; background: var(--nacht2); }
.bild-fehlt { padding: 20px; border: 2px dashed var(--muted); border-radius: 12px; color: var(--muted); font-size: 13px; text-align: center; }

.decoder { width: 100%; border-radius: 12px; display: block; background: #fff; }
.chiffre { font-family: "Courier New", monospace; font-weight: 700; font-size: 26px; letter-spacing: .2em; text-align: center; padding: 12px; background: var(--creme); color: var(--karte-text); border-radius: 12px; word-break: break-all; }

.belohnung { animation: auf .5s ease-out; }
@keyframes auf { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.stueck { background: var(--gold); color: var(--karte-text); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; }
.stueck .label { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.stueck .wort { font-family: var(--titel-schrift); font-size: 26px; font-weight: 800; margin-top: 2px; }
.ps { font-family: "Courier New", monospace; font-weight: 700; color: var(--muted); margin-top: 10px; font-size: 15px; letter-spacing: .12em; }

/* Sammelbuch */
.satz { font-family: var(--titel-schrift); font-size: 22px; line-height: 1.8; }
.satz .w { display: inline-block; margin-right: .3em; }
.satz .luecke { display: inline-block; width: 2.4em; border-bottom: 3px dotted var(--muted); margin-right: .3em; transform: translateY(-.25em); }
.psliste { font-family: "Courier New", monospace; font-weight: 700; letter-spacing: .1em; line-height: 1.9; }
.psliste span { color: var(--muted); font-family: Nunito, sans-serif; letter-spacing: 0; font-weight: 600; margin-right: 8px; }

/* Spiele */
.schiebe { position: relative; margin: 0 auto; border-radius: 12px; overflow: hidden; background: var(--tief); touch-action: manipulation; }
.schiebe .kachel { position: absolute; border: 1px solid rgba(0,0,0,.25); transition: left .15s, top .15s; background-repeat: no-repeat; cursor: pointer; }
.memory { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.memory button { aspect-ratio: 3/4; border: 0; border-radius: 10px; background: var(--rot); color: inherit; font-size: 34px; transition: transform .2s; box-shadow: 0 3px 0 var(--rot-dunkel); padding: 0; overflow: hidden; }
.memory button.auf, .memory button.weg { background: var(--creme); color: inherit; }
.memory button.weg { opacity: .45; box-shadow: none; }
.memory button .inhalt { visibility: hidden; display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; }
.memory button.auf .inhalt, .memory button.weg .inhalt { visibility: visible; }
.memory button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.reihe { display: flex; flex-direction: column; gap: 8px; }
.reihe button { text-align: left; background: var(--creme); color: var(--karte-text); border: 3px solid transparent; border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.reihe button.wahl { border-color: var(--gold); }
.reihe button .nr { color: var(--rot); margin-right: 8px; }

/* AR */
.ar-overlay { position: fixed; inset: 0; z-index: 50; background: #000; }
.ar-overlay a-scene { position: absolute; inset: 0; }
.ar-zu { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 60; }

/* Finale */
.zeile-check { margin: 10px 0; }
.zeile-check .label { font-weight: 800; margin-bottom: 6px; }
.zeile-check.ok input { border-color: var(--tanne); background: #e6f4ea; }
.gedicht { text-align: center; padding: 28px 8px; }
.gedicht p { font-family: var(--titel-schrift); font-size: 23px; line-height: 1.4; margin: 0 0 14px; opacity: 0; animation: auf 1.2s ease-out forwards; }
.gedicht p.gross { font-size: 30px; color: var(--gold); }
.schnee { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.schnee i { position: absolute; top: -12px; border-radius: 50%; background: var(--schnee); box-shadow: 0 0 6px var(--schnee);
  animation: fall var(--d) var(--v) linear infinite, taumeln var(--sd) ease-in-out infinite alternate; }
@keyframes fall { to { transform: translate3d(0, 112vh, 0); } }
@keyframes taumeln { from { margin-left: calc(-1 * var(--sway)); } to { margin-left: var(--sway); } }

.vorschau-leiste { background: var(--gold); color: var(--karte-text); font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 10px; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vorschau-leiste button { background: var(--karte-text); color: var(--gold); border: 0; border-radius: 6px; padding: 3px 8px; font-weight: 800; }

/* Fehlerseite \u2013 bewusst langweilig */
body.fehler { background: #f3f3f3; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.fehlerseite { max-width: 520px; margin: 18vh auto 0; padding: 0 24px; }
.fehlerseite h1 { font-family: inherit; font-weight: 600; font-size: 26px; color: #444; }
.fehlerseite p { color: #666; line-height: 1.5; font-size: 15px; }
.fehlerseite .id { color: #aaa; font-size: 12px; margin-top: 32px; font-family: monospace; }
.eckbild { position: fixed; right: -5px; bottom: 34px; width: 22px; transform: rotate(-24deg); opacity: .9; }

/* \u2500\u2500 Generische Bausteine \u2500\u2500 */
.blase.erzaehler { border-top-left-radius: var(--radius); margin: 10px 0 18px; }
.laden { color: var(--muted); }
.stufe + .stufe { margin-top: 26px; padding-top: 18px; border-top: 2px dashed var(--linie2); }
.stufe.frisch { animation: auf .5s ease-out; }
.spaet { opacity: 0; animation: auf 1.2s ease-out forwards; }
.werkzeug-chip { display: inline-block; background: var(--linie2); color: var(--gold); font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; margin: 6px 0; }
.spiegelschrift { transform: scaleX(-1); font-family: var(--titel-schrift); font-weight: 800; font-size: 26px; text-align: center; padding: 16px; background: var(--creme); color: var(--karte-text); border-radius: 12px; white-space: pre-line; }
.chiffre { white-space: pre-line; }
.chiffre.klein { font-size: 18px; letter-spacing: .1em; }
.anagramm { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin: 12px 0; }
.anagramm span { width: 44px; height: 52px; display: flex; align-items: center; justify-content: center; background: var(--creme); color: var(--karte-text); border-radius: 10px; font-family: var(--titel-schrift); font-weight: 800; font-size: 26px; box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.audio { width: 100%; margin: 10px 0; }
.karte.mitte { text-align: center; }
.zahlenschloss { display: flex; gap: 10px; justify-content: center; margin: 4px 0 16px; }
.rad { display: flex; flex-direction: column; align-items: center; background: var(--tief); border-radius: 12px; padding: 4px; }
.rad button { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 6px 14px; }
.ziffer { font-family: "Courier New", monospace; font-weight: 700; font-size: 34px; width: 48px; text-align: center; background: var(--creme); color: var(--karte-text); border-radius: 8px; padding: 4px 0; }
.auswahl { display: flex; flex-direction: column; gap: 8px; }
.auswahl button { text-align: left; background: var(--creme); color: var(--karte-text); border: 3px solid transparent; border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.auswahl button.falsch { border-color: var(--rot); opacity: .6; }
.schiebe .kachel.zahl { background: var(--creme); color: var(--karte-text); display: flex; align-items: center; justify-content: center; font-family: var(--titel-schrift); font-weight: 800; }
.loesungswort { display: flex; gap: 6px; flex-wrap: wrap; }
.loesungswort span { width: 38px; height: 46px; border-bottom: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: var(--titel-schrift); font-weight: 800; font-size: 24px; }
.konfetti { position: fixed; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
/* Konfetti: aussen die seitliche Bewegung, innen Wurf (hoch, dann fallen) und Drehung */
.konfetti i { position: absolute; left: var(--x0); bottom: -20px; display: block; opacity: 0; animation: k-seit var(--dauer) var(--verz) cubic-bezier(.15,.6,.35,1) forwards; }
.konfetti b { display: block; animation: k-wurf var(--dauer) var(--verz) forwards; }
@keyframes k-seit { 0% { transform: translateX(0); opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(var(--dx)); opacity: 0; } }
@keyframes k-wurf {
  0% { transform: translateY(0) rotateX(0) rotateY(0); animation-timing-function: cubic-bezier(.1,.7,.3,1); }
  32% { transform: translateY(calc(-1 * var(--h))) rotateX(200deg) rotateY(120deg); animation-timing-function: cubic-bezier(.5,0,.8,.4); }
  100% { transform: translateY(25vh) rotateX(var(--rot)) rotateY(var(--rot)); }
}
.vorschau-leiste select { font: inherit; font-weight: 700; border-radius: 6px; border: 0; padding: 2px 6px; }
.vorschau-knopf { margin-top: 8px; }
@media (prefers-reduced-motion: reduce) { .spaet, .gedicht p, .stufe.frisch { animation-duration: .01s !important; } }

.figur-sagt .symbol { font-size: 42px; width: 54px; flex: none; text-align: center; line-height: 1.1; margin-top: 2px; }
.kopf .symbol { font-size: 54px; line-height: 1; }

/* Pixelbild */
.pixelrahmen { background: var(--tief); border-radius: 12px; overflow: hidden; margin: 10px 0; }
.pixelbild { width: 100%; height: auto; display: block; }
.tipps { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.tipp { background: var(--nacht2); border-radius: 12px; padding: 10px 14px; font-size: 16px; line-height: 1.4; }
.tipp b { color: var(--gold); }
.tipp.neu { animation: auf .4s ease-out; }
.tipp-zeile { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tipp-info { color: var(--muted); font-size: 14px; }
.pixel-loesung { margin: 10px 0; text-align: center; }
.pixel-loesung img { width: 100%; border-radius: 12px; display: block; animation: scharf 1.6s ease-out; }
.pixel-loesung .loesung { font-family: var(--titel-schrift); font-weight: 800; font-size: 28px; color: var(--gold); margin-top: 10px; }
@keyframes scharf { from { filter: blur(18px) saturate(.6); transform: scale(1.03); } to { filter: none; transform: none; } }

.chiffre.freimaurer { color: var(--karte-text); padding: 16px; }
.chiffre.freimaurer svg { display: block; margin: 0 auto; }

/* Vorschau im Generator: wie auf dem Handy \u2013 scrollen ja, Balken nein */
html.im-generator { scrollbar-width: none; }
html.im-generator::-webkit-scrollbar, html.im-generator body::-webkit-scrollbar { display: none; }

/* Kalender f\xFCllt den Bildschirm \u2013 wenige T\xFCrchen werden gr\xF6sser */
#app.kalender-ansicht { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; padding-bottom: 16px; }
#app.kalender-ansicht .raster { flex: 1; }
#app.kalender-ansicht .tuer { aspect-ratio: auto; min-height: 64px; }
#app.kalender-ansicht .fuss { margin-top: 16px; }
.raster.sp-3 .tuer { font-size: 34px; } .raster.sp-2 .tuer { font-size: 44px; } .raster.sp-1 .tuer { font-size: 56px; }
.raster.sp-3 .tuer .stern, .raster.sp-2 .tuer .stern, .raster.sp-1 .tuer .stern { font-size: 20px; top: 10px; right: 12px; }

/* \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 Designs \u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500\u2500 */
body.design-geheimnis {
  --nacht: #16110e; --nacht2: #2a211b; --rot: #b8862b; --rot-dunkel: #86611d; --gold: #f2c46d; --tanne: #56703f; --tanne-dunkel: #3b4d2b;
  --text: #f6ecd9; --muted: #b9a88c; --creme: #fffaf0; --karte: #f6ecd9; --karte-text: #2a211b; --tief: #0d0907;
  --punkt1: rgba(242, 196, 109, .10); --punkt2: rgba(255, 230, 190, .05); --zu-text: rgba(246,236,217,.25);
}
body.design-pastell {
  --nacht: #fbf4ef; --nacht2: #efe4f3; --rot: #e17aa5; --rot-dunkel: #c25b88; --gold: #c77d14; --tanne: #5fb893; --tanne-dunkel: #3f9372;
  --text: #3b3350; --muted: #7d7494; --creme: #ffffff; --karte: #ffffff; --karte-text: #3b3350; --tief: #e6dcec;
  --linie: rgba(59,51,80,.06); --linie2: rgba(59,51,80,.12); --zu-text: rgba(59,51,80,.3); --tuer-text: #ffffff;
  --punkt1: rgba(225, 122, 165, .12); --punkt2: rgba(95, 184, 147, .10); --titel-schrift: Nunito, system-ui, sans-serif; --schnee: #e17aa5;
}
body.design-pastell .tuer.zu, body.design-hell .tuer.zu { background: var(--nacht2); }
body.design-geburtstag {
  --nacht: #2b1055; --nacht2: #3f1d78; --rot: #ff6b35; --rot-dunkel: #d24e1e; --gold: #ffd23f; --tanne: #06b58a; --tanne-dunkel: #04876a;
  --text: #ffffff; --muted: #cdb9f2; --creme: #ffffff; --karte: #fff8e7; --karte-text: #2b1055; --tief: #1c0a3a;
  --punkt1: rgba(255, 210, 63, .18); --punkt2: rgba(6, 214, 160, .14); --titel-schrift: Nunito, system-ui, sans-serif;
}
body.design-hell {
  --nacht: #f3f5f8; --nacht2: #e2e7ee; --rot: #2f6fdb; --rot-dunkel: #1f54ad; --gold: #b87a00; --tanne: #2e9e62; --tanne-dunkel: #237a4b;
  --text: #1d2433; --muted: #5b6475; --creme: #ffffff; --karte: #ffffff; --karte-text: #1d2433; --tief: #dfe5ee;
  --linie: rgba(29,36,51,.06); --linie2: rgba(29,36,51,.12); --zu-text: rgba(29,36,51,.3); --tuer-text: #ffffff;
  --punkt1: transparent; --punkt2: transparent; --titel-schrift: Nunito, system-ui, sans-serif; --schnee: #9fb4d6;
}
body.design-pastell .blase, body.design-hell .blase { box-shadow: 0 2px 10px rgba(0,0,0,.08); }

/* Vor dem Start */
.countdown { display: flex; justify-content: center; gap: 12px; margin: 6px 0 18px; }
.cd-teil { background: var(--nacht2); border-radius: 14px; padding: 12px 8px; min-width: 84px; text-align: center; box-shadow: inset 0 0 0 2px var(--linie); }
.cd-teil b .ico { width: 1em; height: 1em; vertical-align: -.1em; }
.cd-teil b { display: block; font-family: var(--titel-schrift); font-size: 40px; line-height: 1; color: var(--gold); }
.cd-teil span { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.raster.vorschau-zu .tuer { cursor: default; }
/* Vor dem Start ohne T\xFCrchen: Inhalt senkrecht in der Mitte */
#app.vorstart-ansicht { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
.vorstart-mitte { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 8vh; }
.vorstart-sub { text-align: center; color: var(--muted); font-size: 16px; margin: 0 0 18px; }
.vorstart-mitte .kopf { justify-content: center; text-align: left; }
.geheimnis { text-align: center; }
.schloss-gross { width: 96px; height: 96px; margin: 0 auto 18px; display: block; color: var(--gold); filter: drop-shadow(0 8px 24px rgba(0,0,0,.4)); }
.schloss-gross .ico { width: 100%; height: 100%; }
.geheimnis .sub { color: var(--muted); font-size: 16px; }
.geheimnis-text { text-align: left; margin-top: 26px; }
.countdown.mit-sekunden { gap: 8px; }
.countdown.mit-sekunden .cd-teil { min-width: 72px; padding: 10px 6px; }
.countdown.mit-sekunden .cd-teil b { font-size: 34px; }

/* Autor-Ansicht auf der Tarnseite */
.autor-hinweis { background: var(--gold); color: var(--karte-text); font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; }

- "belohnung": Liste \u2013 was sie danach bekommt
Eine zweite Stufe erscheint erst, wenn die erste gel\xF6st ist (gut f\xFCr Finale oder zweiteilige R\xE4tsel).

## Bausteine

${Dt("hinweis",t.hinweise)}

Schl\xF6sser:
${Dt("schloss",t.physisch?t.schloesser:t.schloesser.filter(u=>u!=="qr"))}

${Dt("belohnung")}

Jeder Baustein hat die Form {"typ": "...", ...Felder}.

## Regeln f\xFCr gute R\xE4tsel
1. Jedes R\xE4tsel muss allein aus seinen Hinweisen (plus Werkzeugen, die sie schon hat) eindeutig l\xF6sbar sein. Pr\xFCfe das f\xFCr jedes T\xFCrchen einzeln.
2. Die L\xF6sung darf nicht w\xF6rtlich im Hinweistext stehen (ausser bei Chiffre/Anagramm, wo sie verschl\xFCsselt/gemischt erscheint).
3. Abwechslung: nie zweimal hintereinander dasselbe Schloss. Nutze m\xF6glichst viele der erlaubten Bausteine.
4. Jedes T\xFCrchen beginnt mit einem kurzen "text"-Hinweis (2\u20134 S\xE4tze), der die Geschichte weitertr\xE4gt.
5. Jede gel\xF6ste Stufe bekommt eine Belohnung mit "text".
6. Wochentage beachten: an Wochenenden d\xFCrfen R\xE4tsel aufwendiger sein.
7. Alles, was nur der Autor wissen oder beschaffen kann (Fotos, Insider-Antworten, echte Verstecke), bekommt \xABTODO \u2026\xBB im Text oder in autor.vorbereitung.
8. Keine Bilder, Audios oder AR-Ziele erfinden: diese Felder immer null.
9. Ein R\xE4tsel (Memory, Schiebepuzzle, Reihenfolge, Zahlenschloss \u2026) steht NUR im "schloss" \u2013 nie zus\xE4tzlich im "hinweis". Die Hinweis-Typen sind ausschliesslich: ${Object.keys(J.hinweis).join(", ")}.
10. Jede Stufe hat alle drei F\xE4cher: "hinweis" (mindestens ein Text), "schloss" und "belohnung". Nie eine Stufe ohne Schloss und danach eine ohne Hinweis \u2013 das geh\xF6rt in EINE Stufe.
