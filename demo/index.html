    radial-gradient(circle at 70% 30%, var(--punkt2) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 40% 70%, var(--punkt2) 0 1.5px, transparent 2.5px),
    radial-gradient(circle at 85% 80%, var(--punkt1) 0 2px, transparent 3px);
  background-size: 180px 180px, 240px 240px, 200px 200px, 260px 260px;
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
#app { max-width: 560px; margin: 0 auto; padding: 16px 16px 48px; }
/* Nach dem Aufklappen blendet die Türchen-Ansicht sanft ein */
#app.blende { animation: einblenden .45s ease-out both; }
@keyframes einblenden { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { #app.blende { animation: none; } }

h1, h2 { font-family: var(--titel-schrift); font-weight: 800; letter-spacing: -.01em; }
/* Fraunces: weiche, leicht «schiefe» Buchstaben – gibt dem Titel Charakter, den eine Standard-Serif nicht hat */
h1, .tuer .zahl, .gedicht p, .stueck .wort { font-variation-settings: 'SOFT' 60, 'WONK' 1; }
h1 { font-size: 28px; margin: 4px 0 0; line-height: 1.1; }
h2 { font-size: 22px; margin: 0 0 8px; }

button { font: inherit; cursor: pointer; }
.btn {
  background: var(--rot); color: var(--knopf-text, var(--creme)); border: 0; border-radius: 999px;
  padding: 13px 20px 11px; font-weight: 800; font-size: 16px;
  box-shadow: 0 3px 0 var(--rot-dunkel);
  transition: transform .08s;
}
.btn:active { transform: translateY(2px); box-shadow: 0 1px 0 var(--rot-dunkel); }
.btn.leise { background: transparent; color: var(--muted); box-shadow: none; padding: 9px 4px 7px; font-weight: 600; }
.btn:disabled { opacity: .5; }

/* Kopf */
.kopf { display: flex; align-items: center; gap: 12px; margin: 8px 0 20px; }
.kopf img { width: 64px; height: 80px; filter: drop-shadow(0 4px 8px rgba(0,0,0,.3)); }
.kopf .sub { color: var(--muted); font-size: 14px; margin-top: 2px; }

/* Kalender */
/* Flex statt Grid: eine unvollständige letzte Reihe wird zentriert */
.raster { --sp: 4; --abstand: 10px; display: flex; flex-wrap: wrap; justify-content: center; align-content: stretch; gap: var(--abstand); }
.raster .tuer { flex: 0 0 calc((100% - (var(--sp) - 1) * var(--abstand)) / var(--sp)); }
/* Icons */
.ico { width: 1.15em; height: 1.15em; vertical-align: -.22em; flex: none; }
.btn .ico { margin-right: 2px; }

/* Türchen: ein «Blatt» mit Zahl, das beim Antippen aufklappt – dahinter leuchtet das Innere */
.tuer {
  aspect-ratio: 1; border-radius: 14px; border: 0; padding: 0; background: transparent;
  color: var(--tuer-text); font-family: var(--titel-schrift); font-weight: 800; font-size: 26px;
  position: relative; perspective: 700px; -webkit-tap-highlight-color: transparent;
}
.tuer .innen, .tuer .blatt { position: absolute; inset: 0; border-radius: inherit; display: flex; align-items: center; justify-content: center; }
.tuer .innen { background: radial-gradient(circle at 50% 45%, color-mix(in srgb, var(--gold) 55%, var(--tief)) 0, var(--tief) 75%); color: var(--gold); box-shadow: inset 0 0 0 2px var(--linie2); }
.tuer .innen .ico { width: 42%; height: 42%; opacity: .9; }
.tuer .blatt {
  background: linear-gradient(160deg, var(--nacht2) 0%, color-mix(in srgb, var(--nacht2) 70%, var(--tief)) 100%);
  box-shadow: inset 0 0 0 2px var(--linie), inset 0 1px 0 rgba(255,255,255,.08);
  transform-origin: left center; backface-visibility: hidden; -webkit-backface-visibility: hidden;
  transition: transform .55s cubic-bezier(.4,0,.2,1), filter .2s;
}
/* Türrahmen: feine Linie innen, Scharnier-Andeutung links */
.tuer .blatt::before { content: ''; position: absolute; inset: 7px; border-radius: 9px; border: 1.5px solid rgba(255,255,255,.14); pointer-events: none; }
.tuer .blatt::after { content: ''; position: absolute; left: 4px; top: 22%; bottom: 22%; width: 2px; border-radius: 2px; background: rgba(0,0,0,.18); }
.tuer.offen .blatt { background: linear-gradient(160deg, color-mix(in srgb, var(--rot) 88%, #fff) 0%, var(--rot) 45%, var(--rot-dunkel) 100%); box-shadow: 0 3px 0 var(--rot-dunkel), inset 0 1px 0 rgba(255,255,255,.22); }
.tuer.offen .blatt::before { border-color: rgba(255,255,255,.28); }
.tuer.geloest .blatt { background: linear-gradient(160deg, color-mix(in srgb, var(--tanne) 85%, #fff) 0%, var(--tanne) 45%, var(--tanne-dunkel) 100%); box-shadow: 0 3px 0 var(--tanne-dunkel), inset 0 1px 0 rgba(255,255,255,.18); }
.tuer.geloest .zahl { opacity: .55; }
.tuer.offen:hover .blatt { filter: brightness(1.07); }
.tuer.offen:active .blatt { transform: translateY(2px); box-shadow: 0 1px 0 var(--rot-dunkel); }
.tuer.auf .blatt { transform: rotateY(-108deg); box-shadow: -12px 0 24px rgba(0,0,0,.35); }
.tuer.auf .innen .ico { animation: aufleuchten .5s ease-out both; }
@keyframes aufleuchten { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: .9; } }
.tuer.heute .blatt { animation: puls 1.8s ease-in-out infinite; }
.tuer.zu { cursor: default; }
.tuer.zu .blatt { color: var(--zu-text); }
.tuer .zahl { position: relative; text-shadow: 0 1px 0 rgba(0,0,0,.18); }
/* Stempel «gelöst»: leicht schräg, wie aufgedrückt */
.tuer .stempel { position: absolute; width: 38%; max-width: 54px; right: 6%; top: 6%; color: var(--gold); transform: rotate(-14deg); opacity: .95; filter: drop-shadow(0 1px 0 rgba(0,0,0,.25)); }
.raster .tuer.letzte-breit { flex-basis: 100%; }
.raster .tuer.letzte-doppelt { flex-basis: calc((100% - (var(--sp) - 1) * var(--abstand)) / var(--sp) * 2 + var(--abstand)); }
.raster.sp-1 .tuer.letzte-doppelt { flex-basis: 100%; }
.raster .tuer.letzte { font-size: 34px; } .raster.sp-3 .tuer.letzte { font-size: 44px; } .raster.sp-2 .tuer.letzte, .raster.sp-1 .tuer.letzte { font-size: 60px; }
.tuer.letzte-besonders .blatt, .tuer.letzte-doppelt .blatt { box-shadow: inset 0 0 0 3px var(--gold), 0 0 18px color-mix(in srgb, var(--gold) 35%, transparent); }
.tuer.letzte.zu .blatt { color: color-mix(in srgb, var(--gold) 70%, transparent); }
.tuer .schleife { position: absolute; top: 8%; left: 9%; color: var(--gold); width: 17%; height: 17%; max-width: 22px; max-height: 22px; }   /* mitwachsend: bei kleinen Türchen nicht in der Zahl */
.tuer.letzte-breit .schleife, .tuer.letzte-doppelt .schleife { top: 7px; left: 9px; width: 20px; height: 20px; }
.tuer .schleife { line-height: 0; }
.tuer .schleife .ico { width: 100%; height: 100%; display: block; vertical-align: 0; }   /* sonst steht das Symbol auf der Grundlinie der grossen Zahl und rutscht nach unten */
.tuer.letzte .stempel { max-width: 64px; width: 30%; }
@keyframes puls { 0%,100% { box-shadow: 0 3px 0 var(--rot-dunkel), 0 0 0 0 color-mix(in srgb, var(--gold) 60%, transparent); } 50% { box-shadow: 0 3px 0 var(--rot-dunkel), 0 0 0 8px transparent; } }
@media (prefers-reduced-motion: reduce) { .tuer.heute .blatt { animation: none; box-shadow: 0 0 0 3px var(--gold); } .tuer .blatt { transition: none; } }

.fuss { display: flex; justify-content: center; margin-top: 22px; }

/* Tag */
.kopfzeile { display: grid; grid-template-columns: 40px 1fr 40px; align-items: center; gap: 8px; margin: 0 0 14px -4px; }
.kopfzeile .tagnr { text-align: center; }
.zurueck {
  width: 40px; height: 40px; border-radius: 50%; border: 0; display: grid; place-items: center;
  background: var(--nacht2); color: var(--gold); font-size: 30px; line-height: 1; font-weight: 400;
  box-shadow: inset 0 0 0 1.5px var(--linie2); transition: filter .12s, transform .08s;
}
.zurueck .ico { width: 24px; height: 24px; margin-left: -2px; }   /* optisch zentriert: der Pfeil ist linkslastig */
.zurueck:hover { filter: brightness(1.15); }
.zurueck:active { transform: scale(.94); }
.tagnr { font-family: var(--titel-schrift); font-weight: 800; color: var(--gold); font-size: 15px; letter-spacing: .08em; text-transform: uppercase; }
.figur-sagt { display: flex; gap: 10px; align-items: flex-start; margin: 10px 0 18px; }
.figur-sagt img { width: 54px; flex: none; margin-top: 4px; }
.blase {
  background: var(--karte); color: var(--karte-text); border-radius: var(--radius);
  padding: 14px 16px; font-size: 17px; line-height: 1.45; white-space: pre-line;
  box-shadow: 0 6px 20px rgba(0,0,0,.25);
  position: relative;
}
/* Sprechblasen-Spitze, zeigt zur Figur */
.figur-sagt .blase { border-top-left-radius: 6px; }
.figur-sagt .blase::before {
  content: ''; position: absolute; left: -10px; top: 18px;
  border: 8px solid transparent; border-right: 11px solid var(--karte); border-left: 0;   /* 1px Überlappung: sonst Haarspalt auf hochauflösenden Bildschirmen */
}
.karte { background: var(--nacht2); border-radius: var(--radius); padding: 16px; margin: 14px 0; }
.karte.hell { background: var(--karte); color: var(--karte-text); }
.frage { font-weight: 800; margin-bottom: 10px; }
.eingabe { display: flex; gap: 8px; }
.eingabe input {
  flex: 1; min-width: 0; font: inherit; font-size: 17px; padding: 12px 14px;
  border-radius: 12px; border: 2px solid transparent; background: var(--creme); color: var(--karte-text);
}
.eingabe input:focus { outline: none; border-color: var(--gold); }
.antwort-hinweis { min-height: 22px; margin-top: 8px; color: var(--gold); font-weight: 600; font-size: 15px; }
.wackeln { animation: wackeln .35s; }
@keyframes wackeln { 25% { transform: translateX(-6px); } 50% { transform: translateX(6px); } 75% { transform: translateX(-3px); } }

.bilder { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); margin: 12px 0; }
.bilder img { width: 100%; border-radius: 12px; display: block; background: var(--nacht2); }
.bild-fehlt { padding: 20px; border: 2px dashed var(--muted); border-radius: 12px; color: var(--muted); font-size: 13px; text-align: center; }

.decoder { width: 100%; border-radius: 12px; display: block; background: #fff; }
.chiffre { font-family: "Courier New", monospace; font-weight: 700; font-size: 26px; letter-spacing: .2em; text-align: center; padding: 12px; background: var(--creme); color: var(--karte-text); border-radius: 12px; word-break: break-all; }

.belohnung { animation: auf .5s ease-out; }
@keyframes auf { from { opacity: 0; transform: translateY(12px) scale(.97); } to { opacity: 1; transform: none; } }
.stueck { background: var(--gold); color: var(--karte-text); border-radius: var(--radius); padding: 14px 16px; margin: 12px 0; }
.stueck .label { font-size: 13px; font-weight: 800; letter-spacing: .06em; text-transform: uppercase; opacity: .7; }
.stueck .wort { font-family: var(--titel-schrift); font-size: 26px; font-weight: 800; margin-top: 2px; }
.ps { font-family: "Courier New", monospace; font-weight: 700; color: var(--muted); margin-top: 10px; font-size: 15px; letter-spacing: .12em; }

/* Sammelbuch */
.satz { font-family: var(--titel-schrift); font-size: 22px; line-height: 1.8; }
.satz .w { display: inline-block; margin-right: .3em; }
.satz .luecke { display: inline-block; width: 2.4em; border-bottom: 3px dotted var(--muted); margin-right: .3em; transform: translateY(-.25em); }
.psliste { font-family: "Courier New", monospace; font-weight: 700; letter-spacing: .1em; line-height: 1.9; }
.psliste span { color: var(--muted); font-family: Nunito, sans-serif; letter-spacing: 0; font-weight: 600; margin-right: 8px; }

/* Spiele */
.schiebe { position: relative; margin: 0 auto; border-radius: 12px; overflow: hidden; background: var(--tief); touch-action: manipulation; }
.schiebe .kachel { position: absolute; border: 1px solid rgba(0,0,0,.25); transition: left .15s, top .15s; background-repeat: no-repeat; cursor: pointer; }
.memory { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.memory button { aspect-ratio: 3/4; border: 0; border-radius: 10px; background: var(--rot); color: inherit; font-size: 34px; transition: transform .2s; box-shadow: 0 3px 0 var(--rot-dunkel); padding: 0; overflow: hidden; }
.memory button.auf, .memory button.weg { background: var(--creme); color: inherit; }
.memory button.weg { opacity: .45; box-shadow: none; }
.memory button .inhalt { visibility: hidden; display: flex; width: 100%; height: 100%; align-items: center; justify-content: center; }
.memory button.auf .inhalt, .memory button.weg .inhalt { visibility: visible; }
.memory button img { width: 100%; height: 100%; object-fit: cover; display: block; }
.reihe { display: flex; flex-direction: column; gap: 8px; }
.reihe button { text-align: left; background: var(--creme); color: var(--karte-text); border: 3px solid transparent; border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.reihe button.wahl { border-color: var(--gold); }
.reihe button .nr { color: var(--rot); margin-right: 8px; }

/* AR */
.ar-overlay { position: fixed; inset: 0; z-index: 50; background: #000; }
.ar-overlay a-scene { position: absolute; inset: 0; }
.ar-zu { position: fixed; top: max(12px, env(safe-area-inset-top)); right: 12px; z-index: 60; }

/* Finale */
.zeile-check { margin: 10px 0; }
.zeile-check .label { font-weight: 800; margin-bottom: 6px; }
.zeile-check.ok input { border-color: var(--tanne); background: #e6f4ea; }
.gedicht { text-align: center; padding: 28px 8px; }
.gedicht p { font-family: var(--titel-schrift); font-size: 23px; line-height: 1.4; margin: 0 0 14px; opacity: 0; animation: auf 1.2s ease-out forwards; }
.gedicht p.gross { font-size: 30px; color: var(--gold); }
.schnee { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 5; }
.schnee i { position: absolute; top: -12px; border-radius: 50%; background: var(--schnee); box-shadow: 0 0 6px var(--schnee);
  animation: fall var(--d) var(--v) linear infinite, taumeln var(--sd) ease-in-out infinite alternate; }
@keyframes fall { to { transform: translate3d(0, 112vh, 0); } }
@keyframes taumeln { from { margin-left: calc(-1 * var(--sway)); } to { margin-left: var(--sway); } }

.vorschau-leiste { background: var(--gold); color: var(--karte-text); font-size: 13px; font-weight: 700; padding: 6px 12px; border-radius: 10px; margin-bottom: 10px; display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.vorschau-leiste button { background: var(--karte-text); color: var(--gold); border: 0; border-radius: 6px; padding: 3px 8px; font-weight: 800; }

/* Fehlerseite – bewusst langweilig */
body.fehler { background: #f3f3f3; color: #333; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
.fehlerseite { max-width: 520px; margin: 18vh auto 0; padding: 0 24px; }
.fehlerseite h1 { font-family: inherit; font-weight: 600; font-size: 26px; color: #444; }
.fehlerseite p { color: #666; line-height: 1.5; font-size: 15px; }
.fehlerseite .id { color: #aaa; font-size: 12px; margin-top: 32px; font-family: monospace; }
.eckbild { position: fixed; right: -5px; bottom: 34px; width: 22px; transform: rotate(-24deg); opacity: .9; }

/* ── Generische Bausteine ── */
.blase.erzaehler { border-top-left-radius: var(--radius); margin: 10px 0 18px; }
.laden { color: var(--muted); }
.stufe + .stufe { margin-top: 26px; padding-top: 18px; border-top: 2px dashed var(--linie2); }
.stufe.frisch { animation: auf .5s ease-out; }
.spaet { opacity: 0; animation: auf 1.2s ease-out forwards; }
.werkzeug-chip { display: inline-block; background: var(--linie2); color: var(--gold); font-weight: 800; font-size: 13px; padding: 4px 10px; border-radius: 999px; margin: 6px 0; }
.spiegelschrift { transform: scaleX(-1); font-family: var(--titel-schrift); font-weight: 800; font-size: 26px; text-align: center; padding: 16px; background: var(--creme); color: var(--karte-text); border-radius: 12px; white-space: pre-line; }
.chiffre { white-space: pre-line; }
.chiffre.klein { font-size: 18px; letter-spacing: .1em; }
.anagramm { display: flex; flex-wrap: wrap; gap: 18px 22px; justify-content: center; margin: 12px 0 6px; }
.anagramm-wort { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
.anagramm-box { margin-bottom: 8px; }
.anagramm-kachel.wahl { outline: 3px solid var(--gold); outline-offset: 2px; transform: translateY(-3px); }
.anagramm-kachel.getauscht { animation: kachel-tausch .25s ease-out; }
@keyframes kachel-tausch { from { transform: scale(.85); } to { transform: scale(1); } }
.anagramm-kachel { --b: clamp(32px, calc((min(100vw, 560px) - 70px) / var(--n, 1) - 6px), 44px); border: 0; padding: 0; cursor: pointer; transition: transform .15s; width: var(--b); height: calc(var(--b) * 1.18); display: flex; align-items: center; justify-content: center; background: var(--creme); color: var(--karte-text); border-radius: 10px; font-family: var(--titel-schrift); font-weight: 800; font-size: calc(var(--b) * .58); box-shadow: 0 3px 0 rgba(0,0,0,.25); }
.audio { width: 100%; margin: 10px 0; }
.karte.mitte { text-align: center; }
.zahlenschloss { display: flex; gap: 10px; justify-content: center; margin: 4px 0 16px; }
.rad { display: flex; flex-direction: column; align-items: center; background: var(--tief); border-radius: 12px; padding: 4px; }
.rad button { background: none; border: 0; color: var(--muted); font-size: 18px; padding: 6px 14px; }
.ziffer { font-family: "Courier New", monospace; font-weight: 700; font-size: 34px; width: 48px; text-align: center; background: var(--creme); color: var(--karte-text); border-radius: 8px; padding: 4px 0; }
.auswahl { display: flex; flex-direction: column; gap: 8px; }
.auswahl button { text-align: left; background: var(--creme); color: var(--karte-text); border: 3px solid transparent; border-radius: 12px; padding: 12px 14px; font-weight: 700; }
.auswahl button.falsch { border-color: var(--rot); opacity: .6; }
.schiebe .kachel.zahl { background: var(--creme); color: var(--karte-text); display: flex; align-items: center; justify-content: center; font-family: var(--titel-schrift); font-weight: 800; }
.loesungswort { display: flex; gap: 6px; flex-wrap: wrap; }
.loesungswort span { width: 38px; height: 46px; border-bottom: 3px solid var(--gold); display: flex; align-items: center; justify-content: center; font-family: var(--titel-schrift); font-weight: 800; font-size: 24px; }
.konfetti { position: fixed; inset: 0; pointer-events: none; z-index: 6; overflow: hidden; }
/* Konfetti: aussen die seitliche Bewegung, innen Wurf (hoch, dann fallen) und Drehung */
.konfetti i { position: absolute; left: var(--x0); bottom: -20px; display: block; opacity: 0; animation: k-seit var(--dauer) var(--verz) cubic-bezier(.15,.6,.35,1) forwards; }
.konfetti b { display: block; animation: k-wurf var(--dauer) var(--verz) forwards; }
@keyframes k-seit { 0% { transform: translateX(0); opacity: 1; } 85% { opacity: 1; } 100% { transform: translateX(var(--dx)); opacity: 0; } }
@keyframes k-wurf {
  0% { transform: translateY(0) rotateX(0) rotateY(0); animation-timing-function: cubic-bezier(.1,.7,.3,1); }
  32% { transform: translateY(calc(-1 * var(--h))) rotateX(200deg) rotateY(120deg); animation-timing-function: cubic-bezier(.5,0,.8,.4); }
  100% { transform: translateY(25vh) rotateX(var(--rot)) rotateY(var(--rot)); }
}
.vorschau-leiste select { font: inherit; font-weight: 700; border-radius: 6px; border: 0; padding: 2px 6px; }
.vorschau-knopf { margin-top: 8px; }
@media (prefers-reduced-motion: reduce) { .spaet, .gedicht p, .stufe.frisch { animation-duration: .01s !important; } }

.figur-sagt .symbol { font-size: 42px; width: 54px; flex: none; text-align: center; line-height: 1.1; margin-top: 2px; }
.kopf .symbol { font-size: 54px; line-height: 1; }

/* Pixelbild */
.pixelrahmen { background: var(--tief); border-radius: 12px; overflow: hidden; margin: 10px 0; }
.pixelbild { width: 100%; height: auto; display: block; }
.tipps { display: flex; flex-direction: column; gap: 6px; margin: 8px 0; }
.tipp { background: var(--nacht2); border-radius: 12px; padding: 10px 14px; font-size: 16px; line-height: 1.4; }
.tipp b { color: var(--gold); }
.tipp.neu { animation: auf .4s ease-out; }
.tipp-zeile { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.tipp-info { color: var(--muted); font-size: 14px; }
.pixel-loesung { margin: 10px 0; text-align: center; }
.pixel-loesung img { width: 100%; border-radius: 12px; display: block; animation: scharf 1.6s ease-out; }
.pixel-loesung .loesung { font-family: var(--titel-schrift); font-weight: 800; font-size: 28px; color: var(--gold); margin-top: 10px; }
@keyframes scharf { from { filter: blur(18px) saturate(.6); transform: scale(1.03); } to { filter: none; transform: none; } }

.chiffre.freimaurer { color: var(--karte-text); padding: 16px; }
.chiffre.freimaurer svg { display: block; margin: 0 auto; }

/* Vorschau im Generator: wie auf dem Handy – scrollen ja, Balken nein */
html.im-generator { scrollbar-width: none; }
html.im-generator::-webkit-scrollbar, html.im-generator body::-webkit-scrollbar { display: none; }

/* Kalender füllt den Bildschirm – wenige Türchen werden grösser */
#app.kalender-ansicht { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; padding-bottom: 16px; }
#app.kalender-ansicht .raster { flex: 1; }
#app.kalender-ansicht .tuer { aspect-ratio: auto; min-height: 64px; }
#app.kalender-ansicht .fuss { margin-top: 16px; }
.raster.sp-3 .tuer { font-size: 34px; } .raster.sp-2 .tuer { font-size: 44px; } .raster.sp-1 .tuer { font-size: 56px; }
.raster.sp-3 .tuer .stern, .raster.sp-2 .tuer .stern, .raster.sp-1 .tuer .stern { font-size: 20px; top: 10px; right: 12px; }

/* ───────── Designs ───────── */
body.design-geheimnis {
  --nacht: #16110e; --nacht2: #2a211b; --rot: #b8862b; --rot-dunkel: #86611d; --gold: #f2c46d; --tanne: #56703f; --tanne-dunkel: #3b4d2b;
  --text: #f6ecd9; --muted: #b9a88c; --creme: #fffaf0; --karte: #f6ecd9; --karte-text: #2a211b; --tief: #0d0907;
  --punkt1: rgba(242, 196, 109, .10); --punkt2: rgba(255, 230, 190, .05); --zu-text: rgba(246,236,217,.25);
}
body.design-pastell {
  --nacht: #fbf4ef; --nacht2: #efe4f3; --rot: #e17aa5; --rot-dunkel: #c25b88; --gold: #c77d14; --tanne: #5fb893; --tanne-dunkel: #3f9372;
  --text: #3b3350; --muted: #7d7494; --creme: #ffffff; --karte: #ffffff; --karte-text: #3b3350; --tief: #e6dcec;
  --linie: rgba(59,51,80,.06); --linie2: rgba(59,51,80,.12); --zu-text: rgba(59,51,80,.3); --tuer-text: #ffffff;
  --punkt1: rgba(225, 122, 165, .12); --punkt2: rgba(95, 184, 147, .10); --titel-schrift: Nunito, system-ui, sans-serif; --schnee: #e17aa5;
}
body.design-pastell .tuer.zu, body.design-hell .tuer.zu { background: var(--nacht2); }
body.design-geburtstag {
  --nacht: #2b1055; --nacht2: #3f1d78; --rot: #ff6b35; --rot-dunkel: #d24e1e; --gold: #ffd23f; --tanne: #06b58a; --tanne-dunkel: #04876a;
  --text: #ffffff; --muted: #cdb9f2; --creme: #ffffff; --karte: #fff8e7; --karte-text: #2b1055; --tief: #1c0a3a;
  --punkt1: rgba(255, 210, 63, .18); --punkt2: rgba(6, 214, 160, .14); --titel-schrift: Nunito, system-ui, sans-serif;
}
body.design-hell {
  --nacht: #f3f5f8; --nacht2: #e2e7ee; --rot: #2f6fdb; --rot-dunkel: #1f54ad; --gold: #b87a00; --tanne: #2e9e62; --tanne-dunkel: #237a4b;
  --text: #1d2433; --muted: #5b6475; --creme: #ffffff; --karte: #ffffff; --karte-text: #1d2433; --tief: #dfe5ee;
  --linie: rgba(29,36,51,.06); --linie2: rgba(29,36,51,.12); --zu-text: rgba(29,36,51,.3); --tuer-text: #ffffff;
  --punkt1: transparent; --punkt2: transparent; --titel-schrift: Nunito, system-ui, sans-serif; --schnee: #9fb4d6;
}
body.design-pastell .blase, body.design-hell .blase { box-shadow: 0 2px 10px rgba(0,0,0,.08); }

/* Vor dem Start */
.countdown { display: flex; justify-content: center; gap: 12px; margin: 6px 0 18px; }
.cd-teil { background: var(--nacht2); border-radius: 14px; padding: 12px 8px; min-width: 84px; text-align: center; box-shadow: inset 0 0 0 2px var(--linie); }
.cd-teil b .ico { width: 1em; height: 1em; vertical-align: -.1em; }
.cd-teil b { display: block; font-family: var(--titel-schrift); font-size: 40px; line-height: 1; color: var(--gold); }
.cd-teil span { display: block; margin-top: 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .08em; }
.raster.vorschau-zu .tuer { cursor: default; }
/* Vor dem Start ohne Türchen: Inhalt senkrecht in der Mitte */
#app.vorstart-ansicht { display: flex; flex-direction: column; min-height: 100vh; min-height: 100dvh; }
.vorstart-mitte { flex: 1; display: flex; flex-direction: column; justify-content: center; padding-bottom: 8vh; }
.vorstart-sub { text-align: center; color: var(--muted); font-size: 16px; margin: 0 0 18px; }
.vorstart-mitte .kopf { justify-content: center; text-align: left; }
.geheimnis { text-align: center; }
.schloss-gross { width: 96px; height: 96px; margin: 0 auto 18px; display: block; color: var(--gold); filter: drop-shadow(0 8px 24px rgba(0,0,0,.4)); }
.schloss-gross .ico { width: 100%; height: 100%; }
.geheimnis .sub { color: var(--muted); font-size: 16px; }
.geheimnis-text { text-align: left; margin-top: 26px; }
.countdown.mit-sekunden { gap: 8px; }
.countdown.mit-sekunden .cd-teil { min-width: 72px; padding: 10px 6px; }
.countdown.mit-sekunden .cd-teil b { font-size: 34px; }

/* Autor-Ansicht auf der Tarnseite */
.autor-hinweis { background: var(--gold); color: var(--karte-text); font-size: 13px; font-weight: 700; padding: 8px 12px; border-radius: 10px; margin-bottom: 12px; }

/* Gratis-Kalender: kleine Zeile ganz unten */
.marke-zeile { text-align: center; font-size: 12px; color: var(--muted); opacity: .75; margin: 18px 0 4px; }
.marke-zeile a { color: inherit; text-decoration: underline; text-underline-offset: 2px; }

/* Vollbild-Finale: Enthüllung über den ganzen Bildschirm */
.vollbild { position: fixed; inset: 0; z-index: 4; background: var(--tief); display: grid; place-items: center; padding: 24px; overflow: auto; animation: vollbild-ein .6s ease-out; }
.vollbild.weg { opacity: 0; transition: opacity .4s; }
.vollbild-innen { max-width: 560px; width: 100%; text-align: center; }
.vollbild .gedicht p { font-size: 28px; }
.vollbild .gedicht p.gross { font-size: 40px; }
.vollbild-zu { opacity: 0; pointer-events: none; transition: opacity .6s; }
.vollbild-zu.da { opacity: 1; pointer-events: auto; }
@keyframes vollbild-ein { from { opacity: 0; } to { opacity: 1; } }

/* Fortschritt mitnehmen */
.fortschritt-qr { background: #fff; border-radius: 12px; padding: 10px; width: min(260px, 100%); margin: 4px auto 12px; }
.fortschritt-qr svg { display: block; width: 100%; height: auto; }
.tipp-zeile.mitte { justify-content: center; }
.fortschritt-link { margin-top: 10px; font-size: 13px; color: var(--muted); }
.fortschritt-link .link-text { word-break: break-all; user-select: all; margin-top: 6px; opacity: .8; }
.geraete-hinweis { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; padding: 10px 12px; border-radius: 12px; background: var(--nacht2); color: var(--muted); font-size: 14px; }
.geraete-hinweis svg { flex: none; width: 20px; height: 20px; }
.geraete-hinweis span { flex: 1; }
.geraete-hinweis .mini { background: none; border: 0; color: inherit; font-size: 16px; cursor: pointer; padding: 4px; }

/* ── Neue Schlösser (Labor) ── */
.leise-text { color: var(--muted); font-size: 14px; margin: 6px 0 10px; }
.karte.mitte .btn { margin-top: 8px; }
/* Richtung */
.richtung-anzeige { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin: 4px 0 12px; font-size: 26px; min-height: 36px; }
.richtung-anzeige span { width: 34px; height: 36px; border-radius: 8px; background: color-mix(in srgb, var(--text) 10%, transparent); display: grid; place-items: center; color: var(--text); }
.richtung-anzeige span.voll { background: var(--rot); color: var(--knopf-text, #fff); }
.richtung-kreuz { display: grid; grid-template-columns: repeat(3, 64px); gap: 8px; justify-content: center; }
.pfeil { height: 64px; border-radius: 16px; border: 0; background: color-mix(in srgb, var(--text) 14%, transparent); color: var(--text); font-size: 28px; cursor: pointer; }
.pfeil { display: grid; place-items: center; }
.pfeil .ico { width: 28px; height: 28px; vertical-align: 0; }
.richtung-kreuz.klein .pfeil .ico { width: 24px; height: 24px; }
.richtung-anzeige .ico { width: 20px; height: 20px; vertical-align: 0; }
.pfeil:active { transform: scale(.95); }
.pfeil.loeschen { background: transparent; color: var(--text); font-size: 22px; }
/* Farbe */
.farbschloss { display: flex; gap: 10px; justify-content: center; flex-wrap: wrap; margin: 6px 0; }
.farbfeld { width: 54px; height: 54px; border-radius: 50%; border: 3px solid rgba(0,0,0,.15); cursor: pointer; box-shadow: inset 0 -4px 0 rgba(0,0,0,.15); }
.farbfeld.leer { background: repeating-linear-gradient(45deg, #ddd 0 6px, #eee 6px 12px); }
/* Muster */
.muster { width: min(260px, 80vw); height: auto; touch-action: none; display: block; margin: 0 auto; user-select: none; }
.muster-punkt { fill: var(--text); opacity: .4; transition: opacity .15s, fill .15s; }
.muster-punkt.an { fill: var(--rot); opacity: 1; }
.muster-punkt.falsch { fill: #b00020; }
.muster-linie, .muster-zug { fill: none; stroke: var(--rot); stroke-width: 7; stroke-linecap: round; stroke-linejoin: round; opacity: .75; }
/* Regler */
.regler { display: flex; flex-direction: column; gap: 12px; margin: 6px 0 4px; }
.regler-zeile { display: grid; grid-template-columns: minmax(0, auto) 1fr 32px; gap: 10px; align-items: center; color: var(--text); }
.regler-zeile input { width: 100%; accent-color: var(--rot); }
.regler-wert { font-size: 20px; text-align: right; }
/* Uhr */
.uhr { width: min(220px, 70vw); height: auto; display: block; margin: 0 auto; }
.uhr-blatt { fill: #fff; stroke: var(--karte-text); stroke-width: 3; }
.uhr-strich { stroke: var(--karte-text); stroke-width: 1.5; opacity: .5; }
.uhr-strich.gross { stroke-width: 3; opacity: .9; }
.uhr-zahl { font-size: 17px; text-anchor: middle; fill: var(--karte-text); font-family: var(--titel-schrift); }
.uhr-stunde { stroke: var(--karte-text); stroke-width: 7; stroke-linecap: round; transition: transform .25s; }
.uhr-minute { stroke: var(--rot); stroke-width: 4; stroke-linecap: round; transition: transform .25s; }
.uhr-mitte { fill: var(--rot); }
.uhr-anzeige { font-size: 22px; color: var(--text); margin: 6px 0; font-variant-numeric: tabular-nums; }
.uhr-steuer { display: flex; gap: 18px; justify-content: center; flex-wrap: wrap; color: var(--text); }
.uhr-steuer > div { display: flex; align-items: center; gap: 6px; }
.uhr-steuer .btn { min-width: 44px; margin: 0; }
/* Uhrzeit-Schloss */
.karte .schloss-gross { width: 64px; height: 64px; margin: 4px auto 8px; color: var(--text); opacity: .7; }
.karte .schloss-gross.offen { color: var(--tanne); opacity: 1; }
.karte .schloss-gross svg { width: 100%; height: 100%; }
/* Lights Out */
.lichter { display: grid; gap: 8px; width: min(280px, 80vw); margin: 6px auto; }
.lichter button { aspect-ratio: 1; border-radius: 12px; border: 0; background: #3a3f55; cursor: pointer; transition: background .2s, box-shadow .2s; }
.lichter button.an { background: #ffd23f; box-shadow: 0 0 18px rgba(255, 210, 63, .7); }
/* Tonfolge */
.simon-rad { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; width: min(240px, 70vw); margin: 8px auto 12px; }
.simon { aspect-ratio: 1; border: 0; cursor: pointer; opacity: .55; transition: opacity .1s, transform .1s; }
.simon.an { opacity: 1; transform: scale(1.04); }
.simon-0 { background: #2a9d8f; border-top-left-radius: 100%; }
.simon-1 { background: #e63946; border-top-right-radius: 100%; }
.simon-2 { background: #ffd23f; border-bottom-left-radius: 100%; }
.simon-3 { background: #3a86ff; border-bottom-right-radius: 100%; }
.regler + .mitte, .karte .mitte { text-align: center; }
.uhr-steuer .btn { width: 44px; height: 44px; padding: 0; border-radius: 50%; font-size: 22px; line-height: 1; background: color-mix(in srgb, var(--text) 14%, transparent); color: var(--text); box-shadow: none; }
.uhr-steuer span { min-width: 64px; text-align: right; }
.uhr-zahl { font-size: 15px; }
.muster-zug.aus { display: none; }

/* ── Neue Spiele (Labor) ── */
/* Puzzle */
.puzzle { position: relative; margin: 6px auto; border-radius: 10px; overflow: hidden; touch-action: manipulation; }
.puzzle-teil { position: absolute; border: 0; padding: 0; background-repeat: no-repeat; cursor: pointer; transition: left .25s, top .25s, box-shadow .2s; box-shadow: inset 0 0 0 1px rgba(255,255,255,.35); }
.puzzle-teil.wahl { box-shadow: inset 0 0 0 4px var(--gold); z-index: 2; }
.puzzle.fertig .puzzle-teil { box-shadow: none; }
/* Labyrinth */
.labyrinth { width: min(320px, 86vw, calc(100svh - 400px)); height: auto; display: block; margin: 4px auto 10px; touch-action: none; background: color-mix(in srgb, var(--text) 6%, transparent); border-radius: 8px; }
.laby-wand { stroke: var(--text); stroke-width: 3; stroke-linecap: round; fill: none; }
.laby-spur { fill: none; stroke: var(--gold); stroke-width: 4; stroke-linecap: round; stroke-linejoin: round; opacity: .55; }
.laby-figur { fill: var(--rot); transition: cx .18s, cy .18s; }
.laby-ziel { text-anchor: middle; }
.richtung-kreuz.klein { grid-template-columns: repeat(3, 52px); }
.richtung-kreuz.klein .pfeil { height: 52px; font-size: 24px; }
/* Wortsuche */
.wortliste { display: flex; flex-wrap: wrap; gap: 6px 12px; justify-content: center; margin: 0 0 10px; }
.wortliste span { font-weight: 700; }
.wortliste span.gefunden { text-decoration: line-through; opacity: .5; }
.wortgitter { display: grid; gap: 2px; width: min(340px, 88vw); margin: 0 auto; }
.wortgitter button { aspect-ratio: 1; border: 0; border-radius: 6px; background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--text); font: 700 clamp(11px, 3.4vw, 17px) var(--titel-schrift); padding: 0; cursor: pointer; }
.wortgitter button.wahl { background: var(--gold); color: #2b2d42; }
.wortgitter button.gefunden { background: color-mix(in srgb, var(--tanne) 70%, transparent); color: #fff; }
.wortgitter button.kurz { background: color-mix(in srgb, var(--rot) 60%, transparent); }
/* Nonogramm */
.nono { display: grid; gap: 1px; width: min(300px, 78vw); margin: 4px auto; align-items: end; }
.nono-hinw { display: flex; gap: 3px; font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.nono-hinw.spalte { flex-direction: column; align-items: center; justify-content: flex-end; padding-bottom: 3px; }
.nono-hinw.zeile { justify-content: flex-end; padding-right: 5px; align-self: center; }
.nono-zelle { aspect-ratio: 1; border: 0; padding: 0; background: color-mix(in srgb, var(--text) 10%, transparent); cursor: pointer; position: relative; }
.nono-zelle.voll { background: var(--text); }
.nono-zelle.kreuz::after { content: '✕'; position: absolute; inset: 0; display: grid; place-items: center; color: var(--muted); font-size: 12px; }
.nono-zelle.rand-r { margin-right: 2px; }
.nono-zelle.rand-u { margin-bottom: 2px; }
.nono.fertig .nono-zelle.voll { background: var(--gold); }
.nono-modus { display: flex; gap: 8px; justify-content: center; margin-top: 10px; }
.nono-modus .btn.aktiv { outline: 2px solid var(--gold); }
/* Kreuzworträtsel */
.kreuzwort { display: grid; gap: 2px; margin: 4px auto; }
.kw-leer { aspect-ratio: 1; }
.kw-zelle { position: relative; background: #fff; border-radius: 3px; }
.kw-zelle.wort { background: #fff3c4; }
.kw-zelle small { position: absolute; top: 1px; left: 2px; font-size: 9px; color: #555; line-height: 1; pointer-events: none; }
.kw-zelle input { width: 100%; height: 100%; aspect-ratio: 1; border: 0; background: transparent; text-align: center; font: 700 clamp(12px, 4vw, 18px) var(--titel-schrift); color: #2b2d42; padding: 0; text-transform: uppercase; caret-color: var(--rot); }
.kw-aktiv { text-align: center; min-height: 22px; margin: 8px 0 2px; color: var(--gold); font-weight: 700; }
.kw-liste { display: grid; grid-template-columns: 1fr; gap: 10px; margin-top: 10px; font-size: 15px; }
.kw-fragen b { display: block; margin-bottom: 4px; color: var(--gold); }
.kw-fragen span { font-weight: 700; }
@media (min-width: 520px) { .kw-liste { grid-template-columns: 1fr 1fr; } }
/* Suchbild */
.suchbild { position: relative; margin: 4px auto; border-radius: 10px; overflow: hidden; cursor: crosshair; }
.suchbild img { display: block; width: 100%; height: auto; }
.such-ring { position: absolute; aspect-ratio: 1; transform: translate(-50%, -50%); border: 3px solid var(--gold); border-radius: 50%; box-shadow: 0 0 0 2px rgba(0,0,0,.35); pointer-events: none; animation: auf .3s ease-out; }
.such-ring.daneben { border-color: var(--rot); opacity: .8; }

/* ── Erzählen (Labor) ── */
.rebus { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; }
.rebus-teil { display: flex; flex-direction: column; align-items: center; gap: 4px; }
.rebus-teil img { width: 84px; height: 84px; object-fit: cover; border-radius: 10px; }
.rebus-symbol { font-size: 56px; line-height: 1; }
.rebus-zusatz { font: 700 18px var(--titel-schrift); color: var(--gold); }
.rebus-plus { font-size: 26px; color: var(--muted); }
.kette { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 6px; font: 700 20px var(--titel-schrift); }
.kette-start, .kette-schritt, .kette-ziel { background: color-mix(in srgb, var(--text) 12%, transparent); border-radius: 12px; padding: 8px 12px; }
.kette-ziel { background: var(--gold); color: #2b2d42; }
.kette-pfeil { color: var(--muted); display: grid; place-items: center; }
.kette-pfeil .ico { width: 20px; height: 20px; vertical-align: 0; }
.kette-start, .kette-schritt, .kette-ziel { line-height: 1; padding: 11px 13px 9px; }
.zweiteil-kopf { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--gold); font-weight: 700; margin-bottom: 6px; }
.zweiteil-text { font: 600 20px/1.4 var(--titel-schrift); white-space: pre-line; margin-bottom: 8px; }
.zweit-seite { padding-top: 24px; }
.mitte { text-align: center; }
.verdaechtige { display: grid; grid-template-columns: repeat(auto-fill, minmax(120px, 1fr)); gap: 10px; margin: 10px 0; }
.verdaechtig { position: relative; display: flex; flex-direction: column; align-items: center; gap: 4px; padding: 10px 6px; border-radius: 14px; border: 0; background: color-mix(in srgb, var(--text) 10%, transparent); color: var(--text); cursor: pointer; font: inherit; transition: opacity .2s; }
.verdaechtig img { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
.v-symbol { font-size: 42px; line-height: 1.1; }
.v-symbol.v-initiale { display: inline-grid; place-items: center; width: 52px; height: 52px; border-radius: 50%; background: color-mix(in srgb, var(--text) 14%, transparent); font: 700 26px var(--titel-schrift); }
.v-merkmale { display: flex; flex-wrap: wrap; gap: 3px; justify-content: center; }
.v-merkmale span { font-size: 11px; background: color-mix(in srgb, var(--text) 14%, transparent); border-radius: 999px; padding: 1px 7px; }
.verdaechtig.weg { opacity: .35; }
.verdaechtig.weg::after { content: ''; position: absolute; left: 12%; right: 12%; top: 50%; height: 4px; background: var(--rot); transform: rotate(-18deg); border-radius: 2px; }
.taeter-hinweise { margin: 6px 0 4px; padding-left: 20px; }
.taeter-hinweise li { margin: 3px 0; }
.taeter-anklage { margin-top: 4px; }
.karte.brief { background: #fffaf0; color: #3a2e22; font-family: var(--titel-schrift); font-size: 18px; line-height: 1.5; box-shadow: 0 2px 0 rgba(0,0,0,.08); }
.brief-titel { font-weight: 700; margin-bottom: 8px; }
.karte.brief p { margin: 0 0 4px; }
.karte.brief .luecke-zeile { color: #c9b9a3; letter-spacing: .3em; }
.brief-zeilen p { margin: 0; font-family: var(--titel-schrift); }
.bildteile { display: grid; gap: 2px; width: min(320px, 86vw); margin: 4px auto; }
.bildteil { aspect-ratio: 4 / 3; display: grid; place-items: center; overflow: hidden; border-radius: 3px; background-repeat: no-repeat; }
.bildteil img { width: 100%; height: 100%; object-fit: cover; display: block; }
.bildteil.leer { background: color-mix(in srgb, var(--text) 8%, transparent); color: var(--muted); font-size: 13px; }
.bildteile-neu { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-top: 6px; }
.bildteile-neu .bildteil { width: 96px; }
.bildteil:has(img) { aspect-ratio: auto; }

/* ── Welt (Labor) ── */
.foto-platz { width: 120px; height: 120px; margin: 6px auto 10px; border-radius: 16px; border: 2px dashed var(--muted); display: grid; place-items: center; color: var(--muted); }
.foto-platz svg { width: 48px; height: 48px; }
.beweisfoto { display: block; max-width: 100%; max-height: 300px; margin: 6px auto 10px; border-radius: 12px; }
.fotoalbum { display: grid; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); gap: 10px; }
.fotoalbum figure { margin: 0; }
.fotoalbum img { width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 10px; display: block; }
.fotoalbum figcaption { font-size: 12px; color: var(--muted); margin-top: 3px; }
.sensor-balken { height: 16px; border-radius: 999px; background: color-mix(in srgb, var(--text) 12%, transparent); overflow: hidden; margin: 12px 0; }
.sensor-balken span { display: block; height: 100%; width: 0; background: var(--gold); transition: width .15s; }
.sensor-balken.voll span { background: var(--tanne); }

/* Nach der Einsteiger-Prüfung */
.rebus { flex-direction: column; }
.rebus-reihe { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 8px; }
.regler-zeile input[type=range] { -webkit-appearance: none; appearance: none; height: 36px; background: transparent; }
.regler-zeile input[type=range]::-webkit-slider-runnable-track { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--text) 22%, transparent); }
.regler-zeile input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 30px; height: 30px; margin-top: -11px; border-radius: 50%; background: var(--rot); border: 3px solid #fff; box-shadow: 0 1px 4px rgba(0,0,0,.3); }
.regler-zeile input[type=range]::-moz-range-track { height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--text) 22%, transparent); }
.regler-zeile input[type=range]::-moz-range-thumb { width: 26px; height: 26px; border-radius: 50%; background: var(--rot); border: 3px solid #fff; }
.morse-tabelle { margin-top: 10px; text-align: left; }
.morse-tabelle summary { cursor: pointer; color: var(--muted); text-align: center; }
.morse-raster { display: grid; grid-template-columns: repeat(auto-fill, minmax(78px, 1fr)); gap: 4px 10px; margin-top: 8px; font-size: 14px; font-variant-numeric: tabular-nums; }
.morse-raster b { display: inline-block; width: 14px; }
.morse-zeichen { letter-spacing: 3px; font-size: 10px; }
.kw-liste { margin-top: 4px; }
.neustart-zeile { text-align: center; margin: 18px 0 0; }
.notausgang-zeile { text-align: center; margin-top: 4px; }
.loesung-verraten { margin-bottom: 12px; }
.loesung-text { font: 700 22px var(--titel-schrift); margin-top: 4px; overflow-wrap: anywhere; }
.link-knopf { background: none; border: 0; color: var(--muted); text-decoration: underline; font: inherit; font-size: 14px; cursor: pointer; padding: 6px; }

/* Eigenes Fenster (statt Browser-Meldung) */
.e-dialog { position: fixed; inset: 0; z-index: 70; background: rgba(5, 10, 25, .55); display: grid; place-items: center; padding: 20px; animation: vollbild-ein .2s ease-out; }
.e-dialog.weg { opacity: 0; transition: opacity .2s; }
.e-dialog-box { background: var(--karte); color: var(--karte-text); border-radius: var(--radius); padding: 22px 20px 18px; max-width: 360px; width: 100%; box-shadow: 0 18px 50px rgba(0,0,0,.4); animation: auf .25s ease-out; }
.e-dialog-box h2 { font-family: var(--titel-schrift); font-size: 22px; margin: 0 0 8px; color: var(--karte-text); }
.e-dialog-box p { margin: 0 0 18px; line-height: 1.45; font-size: 16px; }
.e-dialog-knoepfe { display: flex; gap: 10px; justify-content: flex-end; flex-wrap: wrap; }
.e-dialog-knoepfe .btn { margin: 0; }
.e-dialog-knoepfe .btn.leise { color: var(--karte-text); }

/* Begrüssung beim ersten Öffnen */
.willkommen-box { max-width: 380px; }
.willkommen-box .figur-zeile, .willkommen-box .sagt { margin: 0 0 12px; }
.willkommen-zeile { border-top: 1px solid color-mix(in srgb, var(--karte-text) 12%, transparent); padding-top: 12px; margin-bottom: 14px; }
.willkommen-zeile p { margin: 0 0 10px; font-size: 15px; }
.willkommen-wahl { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.willkommen-stunde { font: inherit; font-size: 15px; padding: 9px 10px; border-radius: 10px; border: 1px solid color-mix(in srgb, var(--karte-text) 25%, transparent); background: transparent; color: var(--karte-text); }
.willkommen-erinnern.btn.leise { margin: 0; color: var(--karte-text); border: 1.5px solid color-mix(in srgb, var(--karte-text) 30%, transparent); border-radius: 999px; padding: 9px 16px 8px; font-weight: 700; }
.willkommen-erinnern .ico { width: 18px; height: 18px; vertical-align: -3px; }
.willkommen-status { font-size: 14px; margin-top: 8px; color: var(--karte-text); opacity: .8; }
.willkommen-home { display: flex; gap: 10px; align-items: flex-start; }
.willkommen-home .ico { flex: none; width: 22px; height: 22px; margin-top: 1px; }
.willkommen-home p { margin: 0; }
.erinnern-zeile { text-align: center; margin: 4px 0 0; }
.erinnern-zeile .ico { width: 16px; height: 16px; vertical-align: -3px; }

/* Schatzkarte: Pergament, gestrichelte Spur, rotes X */
.schatzkarte { position: relative; margin: 12px 0 18px; padding: 18px 18px 16px; border-radius: 12px; color: #4a3218;
  background: radial-gradient(circle at 20% 15%, #f7e9c8 0, #efd9a8 55%, #e3c48a 100%); box-shadow: inset 0 0 0 2px rgba(120, 80, 30, .25), 0 6px 20px rgba(0,0,0,.25); }
.schatzkarte::before { content: ''; position: absolute; inset: 9px; border: 2px dashed rgba(120, 80, 30, .35); border-radius: 8px; pointer-events: none; }
.schatz-kopf { font: 800 22px var(--titel-schrift); display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
.schatz-x { color: #c1121f; font-size: 22px; transform: rotate(-8deg); }
.schatz-bild img { width: 100%; display: block; border-radius: 6px; border: 3px solid #fff8e8; box-shadow: 0 2px 8px rgba(0,0,0,.25); transform: rotate(-1deg); margin: 4px 0 12px; }
.schatz-ort { font-size: 19px; line-height: 1.4; font-weight: 700; margin: 0 0 8px; white-space: pre-line; }
.schatz-fuss { font-size: 14px; margin: 0; opacity: .75; font-style: italic; }

/* Gutschein: Ticket mit Kerben und goldenem Rand */
.gutschein { position: relative; margin: 12px 0 18px; padding: 20px 26px 18px; text-align: center; border-radius: 14px; color: var(--karte-text);
  background: radial-gradient(circle at 0 50%, transparent 12px, var(--karte) 13px) left / 51% 100% no-repeat, radial-gradient(circle at 100% 50%, transparent 12px, var(--karte) 13px) right / 51% 100% no-repeat;
  filter: drop-shadow(0 6px 16px rgba(0,0,0,.3)); }
.gutschein::before { content: ''; position: absolute; inset: 8px 22px; border: 2px dashed color-mix(in srgb, var(--gold) 80%, #000); border-radius: 8px; pointer-events: none; opacity: .7; }
.gutschein-kopf { font-weight: 800; font-size: 13px; letter-spacing: .25em; text-transform: uppercase; color: color-mix(in srgb, var(--gold) 70%, #000); margin-bottom: 8px; }
.gutschein-text { font: 800 24px/1.25 var(--titel-schrift); margin: 0 0 10px; white-space: pre-line; }
.gutschein-fuss { font-size: 14px; margin: 0; opacity: .75; }
</style>
